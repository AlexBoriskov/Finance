/* ───────── save / delete ───────── */
function finish(msg, kind, ms) { persist(); lastFocus = null; closeModal(); render(); toast(msg, kind, ms); }
function placeTx(tx, oldKey) {
  const key = mkey(tx.date);
  if (oldKey && oldKey !== key) months[oldKey] = (months[oldKey] || []).filter(t => t.id !== tx.id);
  const arr = months[key] || (months[key] = []);
  const i = arr.findIndex(t => t.id === tx.id);
  if (i >= 0) arr[i] = tx; else arr.push(tx);
  return key;
}
function saveDraft() {
  syncDraft();
  const d = draft; if (!d) return;
  if (d.type === 'debt') return saveDebt();
  if (d.type === 'goalx') return saveGoal();
  if (d.type === 'recon') return saveRecon();
  const amt = parseNum(d.amount);
  if (!(amt > 0)) return formErr('Введите сумму больше нуля', 'f-amount');
  if (d.type === 'tx' && !isDate(d.date)) return formErr('Укажите дату', 'f-date');
  let msg = 'Сохранено', kind = '', ms = 3800;
  if (d.type === 'tx') {
    const base = { id: d.id || uid(), kind: d.kind, date: d.date, note: (d.note || '').trim(), planId: d.planId || null, ts: d.ts || Date.now() };
    let tx;
    if (d.kind === 'pay') {
      const debt = debtById(d.debt); if (!debt) return formErr('Выберите долг', 'f-debt');
      const int = d.interest === '' || d.interest == null ? 0 : parseNum(d.interest);
      if (!(int >= 0)) return formErr('Проценты — число от 0', 'f-int');
      if (int > amt + 0.005) return formErr('Проценты не могут быть больше суммы платежа', 'f-int');
      tx = { ...base, amount: round2(amt), debt: debt.id, interest: round2(int), title: '' };
      const left = round2(debtBalance(debt, tx.id) - (tx.amount - tx.interest));
      msg = left <= 0.005 ? `Платёж внесён. Долг «${debt.name}» погашен` : `Платёж внесён. Остаток долга «${debt.name}»: ${money(left)}`;
    } else if (d.kind === 'goal') {
      const g = goalById(d.goal); if (!g) return formErr('Выберите цель', 'f-goal');
      const signed = d.gdir === 'out' ? -amt : amt;
      if (goalSaved(g, base.id) + signed < -0.005) return formErr(`Нельзя снять больше накопленного (${money(goalSaved(g, base.id))})`, 'f-amount');
      tx = { ...base, amount: round2(signed), goal: g.id, title: '' };
      const s = goalSaved(g, base.id) + signed;
      msg = s >= g.target ? `Сохранено. Цель «${g.name}» достигнута` : `Сохранено. До цели «${g.name}» осталось ${money(g.target - s)}`;
    } else {
      const cat = resolveCat(d), tags = d.tags.filter(id => tagById(id));
      tx = { ...base, amount: round2(amt), cat, title: (d.title || '').trim(), store: d.kind === 'out' ? (d.store || '').trim() : '', tags, items: d.kind === 'out' ? d.items : [] };
      if (d.kind === 'out' && d.src && debtById(d.src)) tx.src = d.src;
      if (!tx.items.length) delete tx.items;
    }
    const key = placeTx(tx, d.oldKey);
    if (tx.planId) { const p = plans.find(p => p.id === tx.planId); if (p && p.status !== 'done') { p.status = 'done'; p.txId = tx.id; } }
    if (key !== ui.month) { ui.month = key; msg = (d.kind === 'out' || d.kind === 'in' ? 'Запись сохранена' : msg) + ` (месяц «${monthTitle(key)}»)`; }
    if (tx.kind === 'out') {
      const lm = limitMessages(tx);
      const card = tx.src ? debtById(tx.src) : null;
      if (card && card.limit > 0 && debtBalance(card) > card.limit) lm.push(`Кредитка «${card.name}»: превышен лимит карты на ${money(debtBalance(card) - card.limit)}`);
      if (lm.length) { msg = [msg, ...lm].join('\n'); kind = 'warn'; ms = 6500; }
    }
  } else {
    const cat = resolveCat(d), tags = d.tags.filter(id => tagById(id));
    const p = { id: d.id || uid(), kind: d.kind, title: (d.title || '').trim(), amount: round2(amt), cat, tags, date: isDate(d.date) ? d.date : '', note: (d.note || '').trim(), status: d.status || 'open', txId: d.txId || null, ts: d.ts || Date.now() };
    const i = plans.findIndex(x => x.id === p.id);
    if (i >= 0) plans[i] = p; else plans.push(p);
    msg = 'План сохранён';
  }
  finish(msg, kind, ms);
}
function saveDebt() {
  const d = draft, name = (d.name || '').trim();
  if (!name) return formErr('Введите название', 'd-name');
  const bal0 = parseNum(d.bal0); if (!(bal0 >= 0)) return formErr('Укажите остаток долга (0 или больше)', 'd-bal0');
  const opt = (v, lo, hi, id, label) => { if (v === '' || v == null) return undefined; const n = parseNum(v); if (!(n >= lo && n <= hi)) { formErr(label, id); return null; } return n; };
  const rate = opt(d.rate, 0, 200, 'd-rate', 'Ставка — число от 0 до 200'); if (rate === null) return;
  const monthly = opt(d.monthly, 0.01, 1e10, 'd-monthly', 'Платёж — число больше нуля'); if (monthly === null) return;
  const payDay = opt(d.payday, 1, 31, 'd-payday', 'День платежа — число от 1 до 31'); if (payDay === null) return;
  const limit = d.dkind === 'card' ? opt(d.limit, 0.01, 1e10, 'd-limit', 'Лимит — число больше нуля') : undefined; if (limit === null) return;
  const ex = d.id ? debtById(d.id) : null;
  const obj = { id: ex ? ex.id : 'd' + uid(), kind: d.dkind, name, balance0: round2(bal0), start: isDate(d.start) ? d.start : today(), color: ex ? ex.color : (debts.length * 3 + 1) % PALETTE.length, closed: !!d.closed, adj: ex ? ex.adj || [] : [] };
  if (rate !== undefined) obj.rate = rate;
  if (monthly !== undefined) obj.monthly = round2(monthly);
  if (payDay !== undefined) obj.payDay = Math.round(payDay);
  if (limit !== undefined) obj.limit = round2(limit);
  if (ex) debts[debts.indexOf(ex)] = obj; else debts.push(obj);
  finish(ex ? 'Долг обновлён' : 'Долг добавлен. Теперь можно вносить платежи');
}
function saveGoal() {
  const d = draft, name = (d.gname || '').trim();
  if (!name) return formErr('Введите название', 'gx-name');
  const target = parseNum(d.target); if (!(target > 0)) return formErr('Укажите нужную сумму', 'gx-target');
  const saved0 = d.saved0 === '' ? 0 : parseNum(d.saved0); if (!(saved0 >= 0)) return formErr('Накоплено — число от 0', 'gx-saved0');
  const ex = d.id ? goalById(d.id) : null;
  const obj = { id: ex ? ex.id : 'g' + uid(), name, target: round2(target), saved0: round2(saved0), color: 5, done: !!($('#gx-done')?.checked) };
  if (isDate(d.deadline)) obj.deadline = d.deadline;
  if (ex) goals[goals.indexOf(ex)] = obj; else goals.push(obj);
  finish(ex ? 'Цель обновлена' : 'Цель добавлена');
}
function saveRecon() {
  const d = debtById(draft.debt), a = parseNum(draft.actual);
  if (!d) return;
  if (!(a >= 0)) return formErr('Введите остаток из банка', 'f-actual');
  const diff = round2(a - debtBalance(d));
  if (Math.abs(diff) < 0.005) return finish('Остаток совпадает с записями');
  (d.adj = d.adj || []).push({ id: uid(), date: today(), delta: diff });
  finish(`Остаток «${d.name}» сверен: ${money(a)}`);
}
function deleteDraft() {
  const d = draft; if (!d || !d.id) return;
  if (d.type === 'tx') {
    const f = findTx(d.id);
    if (f) months[f.key] = months[f.key].filter(t => t.id !== d.id);
    plans.forEach(p => { if (p.txId === d.id && p.status === 'done') { p.status = 'open'; p.txId = null; } });
    return finish('Запись удалена');
  }
  if (d.type === 'debt') {
    const x = debtById(d.id), n = x ? debtUsage(x) : 0;
    if (n) return formErr(`По этому долгу есть записи (${n}). Удалите их или отметьте долг закрытым.`);
    debts = debts.filter(y => y.id !== d.id); return finish('Долг удалён');
  }
  if (d.type === 'goalx') {
    const x = goalById(d.id), n = x ? goalUsage(x) : 0;
    if (n) return formErr(`В цель уже вносились деньги (${n}). Удалите взносы или отметьте цель достигнутой.`);
    goals = goals.filter(y => y.id !== d.id); return finish('Цель удалена');
  }
  plans = plans.filter(p => p.id !== d.id); finish('План удалён');
}

/* ───────── export / import ───────── */
async function saveFile(filename, text, mime) {
  try {
    const file = new File([text], filename, { type: mime });
    if (IS_MOBILE && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {
    lastFocus = document.activeElement; draft = null; openSheet();
    $('#mcontent').innerHTML = `<div class="mhead"><h2 id="mtitle">${esc(filename)}</h2><button class="icon" data-act="closeModal" aria-label="Закрыть">×</button></div><p class="hint" style="margin:0 0 10px">Не удалось сохранить файл автоматически. Скопируйте текст и вставьте в файл вручную.</p><textarea class="export" readonly>${esc(text)}</textarea>`;
    return false;
  }
}
const csvCell = v => { const s = String(v ?? ''); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvNum = x => String(x).replace('.', ',');

  const ok = await saveFile(`finance-${today()}.json`, JSON.stringify(exportObj(), null, 1), 'application/json');
  if (ok) { meta.lastBackup = new Date().toISOString(); persist(); if (ui.tab === 'overview' || ui.tab === 'settings') render(); toast('Копия сохранена'); }
}
function exportCsv() {
  const KIND = { in: 'Доход', out: 'Расход', pay: 'Платёж по долгу', goal: 'Взнос в цель' };
  const rows = [['Дата', 'Тип', 'Категория', 'Название', 'Магазин', 'Сумма', 'Из них проценты', 'Оплачено кредиткой', 'Долг или цель', 'Теги', 'Заметка']];

  saveFile(`operations-${today()}.csv`, '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv');
}
async function readImport(file) {

  reconcile(el) { openRecon(el.dataset.id); },
  undoAdj(el) { const d = debtById(el.dataset.id); if (d && d.adj && d.adj.length) { twoStep(el, () => { d.adj.pop(); persist(); render(); toast('Последняя сверка отменена'); }, 'Отменить последнюю?'); } },
  addGoal() { openGoal(); },
  editGoal(el) { openGoal(el.dataset.id); },
  addGoalFromModal() { closeModal(); openGoal(); },
  goalDeposit(el) { openTx({ kind: 'goal', goal: el.dataset.id }); },
  setCur(el) { meta.currency = el.dataset.v; persist(); render(); },
  catColor(el) { const c = catById(el.dataset.id); if (c) { c.color = (c.color + 1) % PALETTE.length; persist(); render(); } },
  catDel(el) {
    const c = catById(el.dataset.id), n = c ? catUsage(c.id) : 0; if (!c) return;
    if (n) return toast(`«${c.name}» используется в ${n} ${plural(n, ['записи', 'записях', 'записях'])}. Переименуйте категорию или сначала смените её у записей.`, 'err');
    meta.cats = meta.cats.filter(x => x.id !== c.id); persist(); render();
  },
  catAdd(el) {
    const kind = el.dataset.kind, inp = $('#new-cat-' + kind), name = inp.value.trim(); if (!name) return inp.focus();
    if (meta.cats.some(c => c.kind === kind && c.name.toLowerCase() === name.toLowerCase())) return toast('Такая категория уже есть', 'err');
    meta.cats.push({ id: 'c' + uid(), kind, name, color: meta.cats.length % PALETTE.length }); persist(); render();
  },
  tagColor(el) { const t = tagById(el.dataset.id); if (t) { t.color = (t.color + 1) % PALETTE.length; persist(); render(); } },
  tagDel(el) { const t = tagById(el.dataset.id); if (!t) return; twoStep(el, () => { meta.tags = meta.tags.filter(x => x.id !== t.id); persist(); render(); }, 'Удалить?'); },
  tagAdd() { const inp = $('#new-tag'); const t = createTag(inp.value); if (!t) return inp.focus(); render(); },
  exportJson, exportCsv,
  importPick() { $('#importFile')?.click(); },
  importApply() { applyImport(); },
  importCancel() { pendingImport = null; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.change;
  if (t.id === 'importFile') { const f = t.files[0]; t.value = ''; if (f) readImport(f); return; }
  if (!k) return;
  const v = t.value;
  switch (k) {
    case 'fcat': ui.f.cat = v; renderOpsList(); break;
    case 'ftag': ui.f.tag = v; renderOpsList(); break;
    case 'dcat': syncDraft(); draft.catNew = v === '__new__'; draft.cat = draft.catNew ? '' : v; renderModal(); if (draft.catNew) $('#f-newcat')?.focus(); break;
    case 'dsrc': syncDraft(); refreshLimitHint(); break;
    case 'ddebt': syncDraft(); draft.interest = ''; draft.estimated = false; initPay(); renderModal(); break;
    case 'dgoal': syncDraft(); refreshGoalCalc(); break;
    case 'dkind': syncDraft(); renderModal(); break;
    case 'extra': { const n = parseNum(v); ui.extra[t.dataset.id] = n > 0 ? n : 0; render(); break; }
    case 'catName': { const c = catById(t.dataset.id); if (c && v.trim()) { c.name = v.trim(); persist(); } else if (c) t.value = c.name; break; }
    case 'catLimit': { const c = catById(t.dataset.id); if (c) { const n = parseNum(v); if (n > 0) { c.limit = round2(n); t.value = fmtIn(c.limit); } else { delete c.limit; t.value = ''; } persist(); } break; }
    case 'totalLimit': { const n = parseNum(v); meta.totalLimit = n > 0 ? round2(n) : 0; t.value = n > 0 ? fmtIn(n) : ''; persist(); break; }
    case 'tagName': { const g = tagById(t.dataset.id); if (g && v.trim()) { g.name = v.trim(); persist(); } else if (g) t.value = g.name; break; }
    case 'opening': { const n = parseNum(v); meta.opening = Number.isFinite(n) ? round2(n) : 0; persist(); break; }
    case 'curCustom': if (v.trim()) { meta.currency = v.trim(); persist(); render(); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-search') { ui.f.q = t.value; renderOpsList(); return; }
  if (!draft) return;
  if (t.id === 'f-amount') {
    draft.amount = t.value;
    if (draft.type === 'tx') { refreshLimitHint(); if (draft.kind === 'pay') { draft.estimated = false; refreshPayCalc(draft.last === 'after' ? 'after' : 'int'); } if (draft.kind === 'goal') refreshGoalCalc(); }
  } else if (t.id === 'f-date') { draft.date = t.value; refreshLimitHint(); }
  else if (t.id === 'f-int') { draft.last = 'int'; draft.estimated = false; refreshPayCalc('int'); }
  else if (t.id === 'f-after') { draft.last = 'after'; draft.estimated = false; refreshPayCalc('after'); }
  else if (t.id === 'f-actual') { draft.actual = t.value; refreshReconCalc(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').firstChild) { closeModal(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (draft) {
    if (t.id === 'f-newtag') { e.preventDefault(); actions.addTagDraft(); }
    else if (t.classList && t.classList.contains('entersave')) { e.preventDefault(); saveDraft(); }
  } else if (t.id === 'new-tag') actions.tagAdd();
  else if (t.id && t.id.startsWith('new-cat-')) actions.catAdd({ dataset: { kind: t.id.slice(8) } });
});

/* ───────── boot ───────── */
try { localStorage.removeItem('fin-ledger-ai'); } catch (e) { /* остатки прошлой версии: ключ API больше не нужен */ }
loadState();
setSave('saved');
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !draft && !saveT) location.reload(); });   // новая версия подхватывается сама
}
})();
</script>
</body>
</html>
