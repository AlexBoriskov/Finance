<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дела и деньги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Дела и деньги</title>
<style>
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#1B2A26; --muted:#5F6E68; --line:#DDE3DD; --soft:#E8EDE7;
  --primary:#2F55E0; --on-primary:#FFFFFF; --income:#12805C; --expense:#C2385A; --plan:#A86B00; --on-plan:#FFFFFF; --goal:#0F7C87;
  --shadow:0 18px 50px rgba(20,40,30,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121816; --surface:#1A2320; --ink:#E6EEEA; --muted:#93A39C; --line:#2B3833; --soft:#222D29;
    --primary:#7D9BFF; --on-primary:#0E1530; --income:#4FD1A1; --expense:#FF7C9C; --plan:#E0AE55; --on-plan:#2A1D00; --goal:#4FC3CF;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.45;font-feature-settings:"tnum" 1;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--income)} .out{color:var(--expense)}
.muted{color:var(--muted)}
.app{max-width:920px;margin:0 auto;padding:0 16px calc(160px + env(safe-area-inset-bottom) + var(--kb,0px));padding-top:env(safe-area-inset-top);overflow-x:clip}
main,main>*,section,.dcard,.pcard,.banner,.field,.setrow{min-width:0}
@media (min-width:720px){.app{padding:env(safe-area-inset-top) 18px 120px}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 6px;flex-wrap:wrap}
.brand{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.savestate{font-size:.78rem;color:var(--muted);text-align:right}
.savestate.err{color:var(--expense);font-weight:600}
.monthnav{display:flex;align-items:center;gap:2px;width:100%;justify-content:space-between;order:3}
@media (min-width:720px){.monthnav{width:auto;order:0}}
.monthnav .label{flex:1;text-align:center;font-weight:700;background:none;border:0;padding:8px;border-radius:10px;font-size:1.02rem}
@media (min-width:720px){.monthnav .label{flex:none;min-width:170px}}
.icon{width:42px;height:42px;border-radius:12px;border:0;background:transparent;font-size:1.4rem;line-height:1;display:inline-grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--soft);color:var(--ink)}
.icon.armed{width:auto;padding:0 12px;font-size:.85rem;font-weight:600;color:var(--expense);background:color-mix(in srgb,var(--expense) 14%,transparent)}

/* nav: bottom bar on phones, top tabs on wide screens */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 2px env(safe-area-inset-bottom)}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;color:var(--muted);font-size:.62rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tab svg{width:22px;height:22px}
@media (max-width:300px){.tab{font-size:.56rem}.tab svg{width:20px;height:20px}}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{color:var(--primary);border-top-color:var(--primary)}
@media (min-width:720px){
  .tabs{position:static;background:none;border-top:0;border-bottom:1px solid var(--line);padding:0;margin:8px 0 22px;gap:2px}
  .tab{flex:none;flex-direction:row;font-size:1rem;padding:10px 14px;border-top:0;border-bottom:3px solid transparent;margin:0 0 -1px}
  .tab svg{display:none}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
}
main{margin-top:14px}
@media (min-width:720px){main{margin-top:0}}

/* generic */
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
h3{font-size:.95rem;margin:0 0 6px;font-weight:700}
section{margin:0 0 32px}
.pad{padding:24px 0}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:12px;border:1px solid transparent;background:var(--primary);color:var(--on-primary);padding:10px 18px;font-weight:600;min-height:46px}
.btn:hover{filter:brightness(1.06)}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--expense);border-color:color-mix(in srgb,var(--expense) 50%,transparent)}
.btn.danger.armed{background:var(--expense);color:#fff}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.empty{padding:30px 0;color:var(--muted);max-width:52ch}
.empty p{margin:0 0 14px}
.tag{--c:#748FA1;display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.74rem;font-weight:600;background:var(--soft);color:var(--muted)}
.badge.over{background:color-mix(in srgb,var(--expense) 16%,transparent);color:var(--expense)}
.badge.debt{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:#748FA1;display:inline-flex;align-items:center;min-height:36px;padding:5px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:transparent;font-size:.9rem}
.chip:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip.on{background:color-mix(in srgb,var(--c) 24%,transparent);border-color:var(--c);font-weight:700}
.track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.fill{display:block;height:100%;border-radius:6px}

/* overview */
.figs{display:flex;gap:10px 26px;flex-wrap:wrap;margin-bottom:18px}
.fig{display:flex;flex-direction:column;gap:2px}
.fig .lbl{font-size:.85rem;color:var(--muted)}
.fig .val{font-size:clamp(1.2rem,5.6vw,1.5rem);font-weight:800;letter-spacing:-.02em}
.flow{display:flex;height:46px;gap:3px;border-radius:14px;overflow:hidden}
.flow .seg{min-width:4px;border-radius:5px}
.flow .seg.rest{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border:1px dashed var(--line);border-radius:5px}
.flow.emptybar{background:var(--soft)}
.flowcap{margin:12px 0 14px;font-weight:600}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:2px 26px}
.legend .nm{white-space:normal!important;overflow-wrap:anywhere;text-overflow:clip!important}
.legend li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--muted);font-size:.82rem;width:38px;text-align:right}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;margin:0;max-width:520px}
.kv dt{overflow-wrap:anywhere}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line)}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:.93rem}
.bars li.click{cursor:pointer}
.bars li>.num{white-space:normal;text-align:right;min-width:0}
@media (max-width:340px){.bars li{grid-template-columns:minmax(0,1fr) auto}.bars li .track{grid-column:1/-1;order:3}}
.bars .sub{display:block;font-size:.76rem;color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:20px}
.banner p{margin:0 0 10px;font-weight:600}
.banner.alert{border-color:color-mix(in srgb,var(--expense) 55%,transparent);background:color-mix(in srgb,var(--expense) 8%,var(--surface))}
.banner.alert p{margin:0 0 6px;color:var(--expense)}
.alist{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.93rem}

/* limits */
.lims{list-style:none;margin:0;padding:0}
.lim{padding:10px 0;border-bottom:1px solid var(--line)}
.lim-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;margin-bottom:6px;font-size:.95rem}
.lim-head>.num{white-space:normal;text-align:right}
.lim-head .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lim.over .nm{color:var(--expense)}
.lim-note{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;margin-top:5px}
.lim-note.muted{display:block}
.limhint,.paycalc{margin:-4px 0 12px;font-size:.86rem;display:flex;flex-direction:column;gap:2px}
.limhint:empty,.paycalc:empty{display:none}
.limhint .over,.paycalc .over{color:var(--expense);font-weight:600}
.limhint .warn,.paycalc .warn{color:var(--plan);font-weight:600}
.limhint .info,.paycalc .info{color:var(--muted)}

/* plans timeline on overview */
.tl{list-style:none;margin:0;padding:0}
.tlrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0}
.tlrow:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tl-date{display:flex;flex-direction:column;width:78px;flex:none;line-height:1.25}
.tl-date b{font-size:.95rem}
.tl-date small{font-size:.74rem;color:var(--muted)}
.tl-amt{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:0 1 auto;min-width:0}
.tl-amt small{font-size:.76rem;white-space:normal;text-align:right}
.warnline{color:var(--plan);font-weight:600}
@media (max-width:300px){.tlrow{flex-wrap:wrap}.tl-amt{flex-basis:100%;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;text-align:left;gap:2px 8px}.tl-amt small.num{white-space:normal}}
.late{color:var(--expense)!important;font-weight:600}

.balhero{display:flex;flex-direction:column;gap:2px;margin:0 0 24px}
.balhero .lbl{font-size:.88rem;color:var(--muted);font-weight:500}
.balhero .bal{font-size:clamp(1.6rem,8vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.balhero .sub{font-size:.8rem;color:var(--muted)}

/* lists */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;max-width:100%}
.toolbar input[type=search]{flex:1 1 100%;min-width:150px}
@media (min-width:720px){.toolbar input[type=search]{flex:1 1 200px}}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg2 button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted);min-height:42px}
.seg2 button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg2.kind{display:flex}
.seg2.kind button{flex:1;padding:8px 4px}
.seg2.kind button[aria-pressed="true"].k-out{background:var(--expense);color:#fff}
.seg2.kind button[aria-pressed="true"].k-in{background:var(--income);color:#fff}
.seg2.kind button[aria-pressed="true"].k-pay{background:var(--primary);color:var(--on-primary)}
.seg2.kind button[aria-pressed="true"].k-goal{background:var(--goal);color:#fff}
.dayhead{display:flex;flex-wrap:wrap;gap:0 10px;justify-content:space-between;font-size:.84rem;color:var(--muted);padding:14px 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.row:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.83rem;color:var(--muted)}
.amt{font-weight:700}
.amt.goal{color:var(--goal)}
.amt.xfer{color:var(--primary)}
.plan-row{border-bottom:1px solid var(--line)}
.plan-row .row{border:0}
.plan-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 10px 22px}
details.fold{margin-top:22px}
details.fold summary{cursor:pointer;font-weight:700;padding:8px 0}
.done-row{opacity:.62}

/* debts & goals */
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;margin-bottom:10px}
.sechead h2{margin:0}
.dcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.dname{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-width:0;font-weight:700;font-size:1.02rem}
.dname .dot{width:12px;height:12px;border-radius:50%;flex:none}
.dname span.t{overflow-wrap:anywhere;min-width:0}
.dbal{text-align:right;flex:none}
.dbal b{display:block;font-size:clamp(1.1rem,5.4vw,1.35rem);letter-spacing:-.01em}
.dbal small{font-size:.76rem;color:var(--muted)}
.dcard .track{height:12px;margin:2px 0 6px}
.dprog{display:flex;flex-wrap:wrap;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:12px 0 0;font-size:.88rem}
@media (max-width:420px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dgrid div{display:flex;justify-content:space-between;gap:8px;min-width:0;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:4px 0}
.dgrid dt{color:var(--muted)} .dgrid dd{margin:0;font-weight:600;text-align:right;white-space:normal;overflow-wrap:anywhere}
.dfc{margin:12px 0 0;font-size:.9rem;padding:10px 12px;background:var(--soft);border-radius:10px}
.dfc.warn{background:color-mix(in srgb,var(--plan) 14%,transparent);color:var(--plan);font-weight:600}
.dactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.extra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:.88rem}
.extra input{width:110px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);text-align:right}
.extra .res{flex-basis:100%;color:var(--ink)}
.dtotal{display:flex;gap:10px 26px;flex-wrap:wrap;margin-bottom:16px}
.dtotal div{display:flex;flex-direction:column}
.dtotal small{font-size:.8rem;color:var(--muted)}
.dtotal b{font-size:1.25rem}

/* лимиты по месяцам в настройках */
.limrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.limrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.limrow .ln{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
.limrow input.limin{flex:0 1 128px;width:128px;min-width:84px;min-height:42px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}

/* settings */
.setlist{list-style:none;margin:0 0 12px;padding:0}
.setrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.setrow input{flex:1 1 0;width:0;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;min-height:42px}
.setrow input:hover{border-color:var(--line)}
.setrow input.limin{flex:0 0 auto;width:88px;text-align:right;border-color:var(--line);background:var(--surface)}
.setrow .cnt{font-size:.8rem;color:var(--muted);min-width:20px;text-align:right}
.dotbtn{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr);gap:0}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:.85rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.field input[type=checkbox]{width:22px;height:22px;min-height:0}
.field.check{flex-direction:row;align-items:center;gap:10px}
.field textarea{min-height:64px;resize:vertical}
.field .mt{margin-top:8px}
.setinline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.setinline .muted{font-size:.85rem}
.setinline input{width:150px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.notice{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.notice.warn{border:1px solid color-mix(in srgb,var(--plan) 55%,transparent)}
details.help{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px;background:var(--surface)}
details.help summary{cursor:pointer;font-weight:600}
details.help p,details.help ol{margin:8px 0 0;font-size:.92rem}
details.help ol{padding-left:20px}

/* sub-navigation inside «Деньги» / «Дела» */
.subnav{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:1 0 auto;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap;min-height:40px}
.subnav button[aria-current="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}

/* today, tasks, projects */
.todayhead{margin:0 0 14px}
.todayhead .d{font-size:1.05rem;font-weight:700}
.balstrip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.balstrip .lbl{font-size:.8rem;color:var(--muted);display:block}
.balstrip b{font-size:1.25rem;letter-spacing:-.01em}
.qadd{display:flex;gap:8px;margin:0 0 8px}
.qadd input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surface)}
.qadd button{flex:none;width:48px;min-height:48px;border-radius:12px;border:0;background:var(--primary);color:var(--on-primary);font-size:1.5rem;line-height:1}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tsec{margin:0 0 22px}
.tsec>h3{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;margin:0 0 2px;font-size:.86rem;color:var(--muted);font-weight:700}
.tsec>h3.late{color:var(--expense)}
.trow{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.chk{position:relative;flex:none;width:46px;height:46px;background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.chk::before{content:"";width:24px;height:24px;border-radius:50%;border:2px solid var(--muted)}
.chk.on::before{background:var(--income);border-color:var(--income)}

<script>
(() => {
'use strict';

/* ───────── helpers ───────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const parseNum = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v ?? '').replace(/[\s\u00A0]/g, '').replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
};
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(new Date(s + 'T00:00:00'));
const mkey = s => s.slice(0, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (arr, f = x => x) => round2(arr.reduce((a, x) => a + f(x), 0));
const plural = (n, f) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; };
const fmtIn = x => String(round2(x)).replace('.', ',');
const DAYW = ['день', 'дня', 'дней'];

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monthTitle = k => { const [y, m] = k.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const dayTitle = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' }); };
const shortDate = ds => { const [y, m, d] = ds.split('-').map(Number); return `${d} ${MON_S[m - 1]}${y !== new Date().getFullYear() ? ' ' + y : ''}`; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const monthYear = (offset) => { const n = new Date(); const d = new Date(n.getFullYear(), n.getMonth() + offset, 1); return `${MON_S[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMonths = n => { const y = Math.floor(n / 12), m = n % 12; return [y ? `${y} ${plural(y, ['год', 'года', 'лет'])}` : '', m ? `${m} мес.` : ''].filter(Boolean).join(' ') || 'меньше месяца'; };

const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = x => { x = round2(x); return Number.isInteger(x) ? nf0.format(x) : nf2.format(x); };

const PALETTE = ['#4C6EF5','#12B886','#F59F00','#E64980','#7950F2','#15AABF','#FA5252','#82C91E','#FD7E14','#3B5BDB','#AE3EC9','#748FA1'];
const col = i => PALETTE[((i ?? 11) % PALETTE.length + PALETTE.length) % PALETTE.length];
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') || ((navigator.maxTouchPoints || 0) > 1 && /Mac/i.test(navigator.platform || ''));

/* ───────── data ───────── */
const DEF_OUT = ['Продукты','Кафе и рестораны','Жильё и коммуналка','Транспорт','Связь и интернет','Здоровье','Одежда и обувь','Дом и быт','Развлечения','Образование','Подарки','Налоги и сборы','Прочее'];
const DEF_IN = ['Зарплата','Подработка','Подарки','Возврат и кэшбэк','Проценты и дивиденды','Прочее'];
const CAT_ICONS = { 'Продукты': '🛒', 'Кафе и рестораны': '☕', 'Жильё и коммуналка': '🏠', 'Транспорт': '🚌', 'Связь и интернет': '📱', 'Здоровье': '💊', 'Одежда и обувь': '👕', 'Дом и быт': '🧺', 'Развлечения': '🎬', 'Образование': '📚', 'Подарки': '🎁', 'Налоги и сборы': '🧾', 'Прочее': '📦', 'Зарплата': '💼', 'Подработка': '🛠️', 'Возврат и кэшбэк': '↩️', 'Проценты и дивиденды': '📈' };
const DEBT_KINDS = { mortgage: 'Ипотека', loan: 'Кредит', card: 'Кредитная карта' };
function defaultMeta() {
  const cats = [];
  DEF_OUT.forEach((n, i) => cats.push({ id: 'e' + i, kind: 'out', name: n, color: i % PALETTE.length, icon: CAT_ICONS[n] }));
  DEF_IN.forEach((n, i) => cats.push({ id: 'i' + i, kind: 'in', name: n, color: (i + 3) % PALETTE.length, icon: CAT_ICONS[n] }));
  return { currency: null, opening: 0, totalLimit: 0, limMonths: {}, ics: defaultIcs(), lastBackup: null, cats, tags: [{ id: 't0', name: 'Важно', color: 6 }, { id: 't1', name: 'Можно отложить', color: 11 }] };
}
let meta = defaultMeta();
let plans = [];      // {id, kind:'in'|'out', title, amount, cat, tags, date, note, status, txId, ts}
let months = {};     // 'YYYY-MM' -> [tx]
let debts = [];      // {id, kind:'mortgage'|'loan'|'card', name, balance0, start, rate?, monthly?, payDay?, limit?, color, closed, adj:[{id,date,delta}]}

/* Расходы месяца = траты (своими деньгами и кредиткой) + проценты по долгам.

    else if (t.kind === 'out') spend += t.amount;
    else if (t.kind === 'pay') { interest += t.interest || 0; principal += t.amount - (t.interest || 0); }
    else if (t.kind === 'goal') goal += t.amount;
    else if (t.kind === 'lend') lend += t.amount;
    else if (t.kind === 'recv') recv += t.amount;
  }
  spend += interest;
  return { inc: round2(inc), spend: round2(spend), principal: round2(principal), interest: round2(interest), goal: round2(goal), lend: round2(lend), recv: round2(recv), net: round2(inc - spend) };
}

  return [...m].map(([id, amt]) => ({ id, name: catName(id), color: catColor(id), amt: round2(amt) })).sort((a, b) => b.amt - a.amt);
}

  return [...m].map(([id, amt]) => ({ id, name: tagById(id).name, color: col(tagById(id).color), amt: round2(amt) })).sort((a, b) => b.amt - a.amt);
}

  const progLeft = isCard ? (d.limit > 0 ? `Использовано ${Math.round(share * 100)}% лимита` : '') : `Погашено ${Math.round((1 - share) * 100)}% от ${money(ref)}`;
  const progRight = isCard && d.limit > 0 ? `Доступно ${money(Math.max(0, d.limit - bal))} из ${money(d.limit)}` : '';
  const over = isCard && d.limit > 0 && bal > d.limit;
  const rows = [];
  if (st.principal) rows.push(['Погашено основного долга', money(st.principal)]);
  rows.push(['Проценты выплачено', money(st.interest)]);
  if (isCard && st.charges) rows.push(['Покупки по карте', money(st.charges)]);
  if (d.rate >= 0 && d.rate !== undefined && d.rate !== null) rows.push(['Ставка', `${String(d.rate).replace('.', ',')}% годовых`]);
  if (d.monthly > 0) rows.push([isCard ? 'Платёж в месяц' : 'Ежемесячный платёж', `${money(d.monthly)}${d.payDay ? `, ${d.payDay}-го числа` : ''}`]);
  if (st.last) rows.push(['Последний платёж', shortDate(st.last)]);
  let fc = '', fcWarn = false;
  if (!paidOff && d.monthly > 0) {
    const am = amortize(bal, d.rate || 0, d.monthly);
    if (am.ok) fc = `Если платить ${money(d.monthly)} в месяц${isCard ? ' и не тратить с карты' : ''}: закрытие через ${fmtMonths(am.months)} (${monthYear(am.months)}), проценты впереди примерно ${money(Math.round(am.interest))}.`;
    else if (am.reason === 'low') { fc = `Платёж ${money(d.monthly)} не покрывает проценты (около ${money(Math.round(am.monthlyInterest))} в месяц): долг не уменьшается.`; fcWarn = true; }
    else if (am.reason === 'long') fc = 'При таком платеже долг закроется больше чем через 100 лет.';
  } else if (!paidOff) fc = 'Укажите ставку и ежемесячный платёж в карточке долга — приложение покажет срок закрытия и будущие проценты.';
  let extra = '';

    if (ex > 0) {

      <div class="chips" style="margin-bottom:14px">${[['water', 'Пить воду'], ['exercise', 'Зарядка'], ['read', 'Чтение']].map(([k, l]) => `<button type="button" class="chip" style="--c:#4C6EF5" data-act="newHabitTpl" data-v="${k}">＋ ${l}</button>`).join('')}</div>
      <button type="button" class="btn" data-act="newHabit">Создать свою</button></div>`;

  }
  const card = h => { const st = habitStats(h); return `<div class="hcard">${habitRowHtml(h)}<div class="hfoot">${weekStrip(h)}<span class="hint" style="margin:0">${esc(scheduleText(h))}${st.best > 1 ? `, лучшая серия ${st.best}` : ''}</span></div></div>`; };
  const act = habits.filter(h => !h.archived), arch = habits.filter(h => h.archived);
  let html = act.length ? act.map(card).join('') : `<p class="hint">Все привычки в архиве.</p>`;
  if (arch.length) html += `<details class="fold"><summary>Архив (${arch.length})</summary>${arch.map(card).join('')}</details>`;

function viewHabit(root) {
  const h = habitById(ui.habit);

  root.innerHTML = `<div class="phead"><button type="button" class="btn sm ghost" data-act="closeHabit">‹ Привычки</button><button type="button" class="btn sm ghost" data-act="editHabit" data-id="${h.id}">Изменить</button></div>
  <section><h2 class="ptitle"><span class="dot" style="background:${col(h.color)}"></span><span>${esc(h.name)}</span></h2><div id="habitBody"></div></section>`;

}
function renderHabitBody() {
  const box = $('#habitBody'), h = habitById(ui.habit); if (!box || !h) return;
  const t0 = today(), st = habitStats(h), c = col(h.color);
  const goalText = h.type === 'count' ? `Цель: ${fmtNum(h.goal)}${h.unit ? ' ' + h.unit : ''} в день, шаг ${fmtNum(h.step || 1)}` : 'Отмечать: сделал или нет';
  const wdStart = shiftDate(t0, -wdOf(t0) - 28);   // понедельник, с которого начинается сетка из пяти недель
  const cells = Array.from({ length: 35 }, (_, i) => shiftDate(wdStart, i));
  let html = `<p class="hint" style="margin:0 0 12px">${esc(goalText)}. Дни: ${esc(scheduleText(h))}.${h.archived ? ' Привычка в архиве.' : ''}</p>`;
  if (!h.archived && habitScheduled(h, t0)) html += `<div class="hcard">${habitRowHtml(h, { noTitle: true })}</div>`;
  else if (!h.archived) html += `<p class="hint">Сегодня выходной от этой привычки.</p>`;
  html += `<div class="statgrid" style="margin-top:14px"><div><small>Серия</small><b class="num">${st.cur}</b></div><div><small>Лучшая серия</small><b class="num">${st.best}</b></div><div><small>За 30 дней</small><b class="num">${st.rate30 === null ? '—' : st.rate30 + '%'}</b></div><div><small>Всего дней</small><b class="num">${st.total}</b></div></div>
  <h3 style="margin:18px 0 8px">История, пять недель</h3><p class="hint" style="margin:-4px 0 8px">Нажмите на день, чтобы исправить отметку.</p>
  <div class="hgrid" style="--c:${c}">${WD_S.map(w => `<div class="cwd">${w}</div>`).join('')}${cells.map(ds => { const s2 = habitCell(h, ds); return `<button type="button" class="hc ${s2} ${ds === t0 ? 'now' : ''}" data-act="habitDay" data-id="${h.id}" data-d="${ds}" ${s2 === 'future' ? 'disabled' : ''} aria-label="${esc(dayTitle(ds))}">${+ds.slice(8)}</button>`; }).join('')}</div>
  <div class="callegend"><span><i class="cd" style="background:${c}"></i>выполнено</span><span><i class="cd" style="background:color-mix(in srgb,${c} 35%,var(--surface));box-shadow:0 0 0 1px ${c}"></i>частично</span><span><i class="cd" style="border:1px dashed var(--muted)"></i>пропуск</span></div>`;
  box.innerHTML = html;

/* — «Сегодня», дела, проекты — */
function tsec(title, inner, cls, extra) { return `<section class="tsec"><h3 class="${cls || ''}"><span>${title}</span>${extra || ''}</h3>${inner}</section>`; }
function taskRowHtml(t, o = {}) {
  const p = t.project ? projectById(t.project) : null, done = isDoneNow(t), late = !done && t.due && t.due < today();
  const bits = [];
  if (p && !o.noProject) bits.push(`<span class="pchip" style="--c:${col(p.color)}">${esc(p.name)}</span>`);
  if (t.due && !o.noDue) bits.push(`<span class="${late ? 'late' : ''}">${esc(dueLabel(t.due))}</span>`);
  if (t.repeat) bits.push(`<span class="badge">${esc(REPEATS[t.repeat].toLowerCase())}</span>`);
  if (t.note) bits.push('<span class="badge">заметка</span>');
  if (o.next) bits.push('<span class="nextlbl">следующий шаг</span>');
  return `<div class="trow ${done ? 'done' : ''}">
    <button class="chk ${done ? 'on' : ''}" data-act="toggleTask" data-id="${t.id}" aria-pressed="${done}" aria-label="${done ? 'Вернуть в работу' : 'Отметить выполненным'}"></button>
    <button class="trow-main" data-act="editTask" data-id="${t.id}"><span class="ttitle">${esc(t.title)}</span>${bits.length ? `<span class="tmeta">${bits.join('')}</span>` : ''}</button>
    ${o.today ? `<button class="mini-act" data-act="taskToday" data-id="${t.id}">на сегодня</button>` : ''}
    ${o.move ? `<span class="stepmove"><button data-act="moveStep" data-id="${t.id}" data-d="-1" aria-label="Выше">▲</button><button data-act="moveStep" data-id="${t.id}" data-d="1" aria-label="Ниже">▼</button></span>` : ''}
  </div>`;
}
function qaddHtml(scope, placeholder) {
  return `<div class="qadd"><input id="q-title" data-scope="${scope}" placeholder="${placeholder}" maxlength="120" autocomplete="off" enterkeyhint="done" aria-label="${placeholder}"><button type="button" data-act="qadd" data-scope="${scope}" aria-label="Добавить">＋</button></div>
  <div class="qchips" id="qchips">${[['today', 'Сегодня'], ['tomorrow', 'Завтра'], ['', 'Без срока']].map(([v, l]) => `<button type="button" class="chip ${ui.qd[scope] === v ? 'on' : ''}" style="--c:#4C6EF5" data-act="qdue" data-scope="${scope}" data-v="${v}">${l}</button>`).join('')}</div>`;
}
function viewToday(root) {
  const bal = balance();
  root.innerHTML = `<section class="todayhead"><div class="d">${esc(dayTitle(today()))}</div></section>
  <div class="balstrip"><div><span class="lbl">Свободные деньги</span><b class="num ${bal < 0 ? 'out' : ''}">${money(bal)}</b></div><button type="button" class="btn sm ghost" data-act="addTx">＋ Трата</button></div>
  ${qbarHtml()}
  <div id="todayList"></div>`;
  renderTodayList();
}
function renderTodayList() {
  const box = $('#todayList'); if (!box) return;
  const t0 = today();
  const due = tasks.filter(t => !t.done && t.due && t.due <= t0).sort(byTaskDue);
  const overdue = due.filter(t => t.due < t0), todays = due.filter(t => t.due === t0), shown = new Set(due.map(t => t.id));
  const nexts = projects.filter(p => p.status === 'active').map(nextStep).filter(t => t && !shown.has(t.id)).slice(0, 6);
  const doneToday = tasks.filter(t => (t.done && t.doneAt === t0) || (t.repeat && t.lastDone === t0));
  const soon = moneyItems().dated.filter(p => p.date <= shiftDate(t0, 7));
  const cal = calendarIndex(t0, shiftDate(t0, 7)), evToday = (cal.get(t0) || { events: [] }).events, evSoon = [];
  for (let i = 1; i <= 7; i++) ((cal.get(shiftDate(t0, i)) || { events: [] }).events).forEach(e => evSoon.push(e));
  const bdSoon = people.map(q => ({ q, nb: nextBirthday(q) })).filter(x => x.nb.days <= (x.q.remind || 14)).sort((a, b) => a.nb.days - b.nb.days);
  let html = '';
  if (evToday.length) html += tsec('Встречи и события', `<ul class="tl">${evToday.map(e => eventRowHtml(e.ev, e.ds)).join('')}</ul>`);
  if (overdue.length) html += tsec('Просрочено', overdue.map(t => taskRowHtml(t)).join(''), 'late');
  if (todays.length) html += tsec('На сегодня', todays.map(t => taskRowHtml(t)).join(''));
  if (!due.length) html += `<div class="empty" style="padding:6px 0 22px"><p>На сегодня дел нет. Добавьте дело выше или выберите следующий шаг проекта.</p></div>`;
  if (due.length) html += `<div class="btnrow" style="margin:-8px 0 22px"><button type="button" class="btn ghost sm" data-act="rollover">Перенести несделанное на завтра (${due.length})</button></div>`;
  const hToday = habits.filter(h => !h.archived && habitScheduled(h, t0));
  if (hToday.length) html += tsec('Привычки', hToday.map(h => habitRowHtml(h)).join(''), '', `<button type="button" class="chip" data-act="habitsGo">${hToday.filter(h => habitDone(h, t0)).length} из ${hToday.length}</button>`);
  if (nexts.length) html += tsec('Следующие шаги проектов', nexts.map(t => taskRowHtml(t, { today: true, noDue: !t.due })).join(''));
  if (bdSoon.length) html += tsec('Дни рождения', `<ul class="tl">${bdSoon.map(({ q, nb }) => bdayRowHtml(q, nb)).join('')}</ul>`, '', `<button type="button" class="chip" data-act="csubGo">Все</button>`);
  if (evSoon.length) html += tsec('Ближайшие события', `<ul class="tl">${evSoon.slice(0, 6).map(e => eventRowHtml(e.ev, e.ds, { rel: true })).join('')}</ul>`, '', `<button type="button" class="chip" data-act="tab" data-v="cal">Календарь</button>`);
  if (soon.length) html += tsec('Деньги на ближайшую неделю', `<ul class="tl">${soon.map(p => tlRowHtml(p)).join('')}</ul>`, '', `<button type="button" class="chip" data-act="tab" data-v="overview">Все платежи</button>`);
  if (doneToday.length) html += `<details class="fold" style="margin-top:0"><summary>Сделано сегодня (${doneToday.length})</summary>${doneToday.map(t => taskRowHtml(t)).join('')}</details>`;
  box.innerHTML = html;
}

function viewTasks(root) {
  if (ui.habit) return viewHabit(root);
  if (ui.project) return viewProject(root);
  const sub = `<nav class="subnav" aria-label="Разделы дел">${[['list', 'Дела'], ['projects', 'Проекты'], ['habits', 'Привычки']].map(([v, l]) => `<button data-act="tsub" data-v="${v}" aria-current="${ui.tsub === v}">${l}</button>`).join('')}</nav>`;
  if (ui.tsub === 'projects') {
    root.innerHTML = sub + `<div class="sechead"><h2>Проекты</h2><button type="button" class="btn sm ghost" data-act="newProject">＋ Проект</button></div><div id="projList"></div>`;
    return renderProjectsList();
  }
  if (ui.tsub === 'habits') {
    root.innerHTML = sub + `<div class="sechead"><h2>Привычки</h2><button type="button" class="btn sm ghost" data-act="newHabit">＋ Привычка</button></div><div id="habitList"></div>`;
    return renderHabitsList();
  }
  const filter = projects.length ? `<div class="field" style="margin:0 0 14px"><select data-change="tproj" aria-label="Проект"><option value="">Все дела</option><option value="-" ${ui.tproj === '-' ? 'selected' : ''}>Без проекта</option>${projects.map(p => `<option value="${p.id}" ${ui.tproj === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>` : '';
  root.innerHTML = sub + qaddHtml('tasks', 'Новое дело…') + filter + `<div id="taskList"></div>`;
  renderTaskList();
}
function renderTaskList() {
  const box = $('#taskList'); if (!box) return;
  const t0 = today(), tom = shiftDate(t0, 1), week = shiftDate(t0, 7);
  const pass = t => !ui.tproj || (ui.tproj === '-' ? !t.project : t.project === ui.tproj);
  const open = tasks.filter(t => !t.done && pass(t)).sort(byTaskDue);
  const groups = [
    ['Просрочено', open.filter(t => t.due && t.due < t0), 'late'], ['Сегодня', open.filter(t => t.due === t0)], ['Завтра', open.filter(t => t.due === tom)],
    ['На неделе', open.filter(t => t.due > tom && t.due <= week)], ['Позже', open.filter(t => t.due > week)], ['Без срока', open.filter(t => !t.due)]
  ];
  let html = groups.filter(g => g[1].length).map(([title, list, cls]) => tsec(`${title} (${list.length})`, list.map(t => taskRowHtml(t, { noDue: title === 'Сегодня' || title === 'Завтра' })).join(''), cls)).join('');
  if (!open.length) html += `<div class="empty"><p>Дел пока нет. Впишите первое в строке выше, а для дел из нескольких шагов заведите проект.</p></div>`;
  const done = tasks.filter(t => t.done && pass(t)).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '')).slice(0, 30);
  if (done.length) html += `<details class="fold"><summary>Сделано (${done.length})</summary>${done.map(t => taskRowHtml(t)).join('')}</details>`;
  box.innerHTML = html;
}

function projectCardHtml(p) {
  const steps = projectSteps(p), done = steps.filter(t => t.done).length, total = steps.length, share = total ? done / total : 0, nx = nextStep(p);
  const late = p.status !== 'done' && p.due && p.due < today();
  return `<button type="button" class="pcard" data-act="openProject" data-id="${p.id}">
    <div class="ph"><span class="pn"><span class="dot" style="background:${col(p.color)}"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span></span>
      <span class="tmeta">${p.status === 'paused' ? '<span class="badge">на паузе</span>' : ''}${p.status === 'done' ? '<span class="badge in">завершён</span>' : ''}${p.due ? `<span class="${late ? 'late' : ''}">${esc(dueLabel(p.due))}</span>` : ''}</span></div>
    <div class="track"><span class="fill" style="width:${Math.max(done ? 2 : 0, share * 100)}%;background:${col(p.color)}"></span></div>
    <div class="dprog"><span>${done} из ${total} ${plural(total, ['шага', 'шагов', 'шагов'])}</span><span>${Math.round(share * 100)}%</span></div>
    <div class="pnext">${nx ? `Следующий шаг: <b>${esc(nx.title)}</b>` : total ? 'Все шаги выполнены' : 'Шагов пока нет'}</div>
  </button>`;
}
function renderProjectsList() {
  const box = $('#projList'); if (!box) return;
  if (!projects.length) { box.innerHTML = `<div class="empty"><p>Проект — это дело из нескольких шагов: ремонт, поездка, подготовка к событию. У него есть цель, срок и список шагов. В «Сегодня» попадает только следующий шаг, остальные не мешают.</p><button type="button" class="btn" data-act="newProject">Создать проект</button></div>`; return; }
  const by = st => projects.filter(p => p.status === st).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.ts || 0) - (b.ts || 0));
  const act = by('active'), paused = by('paused'), fin = by('done');
  let html = act.map(projectCardHtml).join('');
  if (paused.length) html += `<details class="fold"><summary>На паузе (${paused.length})</summary>${paused.map(projectCardHtml).join('')}</details>`;
  if (fin.length) html += `<details class="fold"><summary>Завершённые (${fin.length})</summary>${fin.map(projectCardHtml).join('')}</details>`;
  box.innerHTML = html;
}
function viewProject(root) {
  const p = projectById(ui.project);
  if (!p) { ui.project = null; return viewTasks(root); }
  root.innerHTML = `<div class="phead"><button type="button" class="btn sm ghost" data-act="closeProject">‹ Проекты</button><button type="button" class="btn sm ghost" data-act="editProject" data-id="${p.id}">Изменить</button></div>
  <section><h2 class="ptitle"><span class="dot" style="background:${col(p.color)}"></span><span>${esc(p.name)}</span></h2>${p.goal ? `<p class="pgoal">${esc(p.goal)}</p>` : ''}<div id="projBody"></div></section>`;

}
function renderProjectBody() {
  const box = $('#projBody'), p = projectById(ui.project); if (!box || !p) return;
  const steps = projectSteps(p), open = steps.filter(t => !t.done), done = steps.filter(t => t.done), share = steps.length ? done.length / steps.length : 0;
  const late = p.status !== 'done' && p.due && p.due < today();
  let html = `<div class="track" style="height:12px"><span class="fill" style="width:${Math.max(done.length ? 2 : 0, share * 100)}%;background:${col(p.color)}"></span></div>
    <div class="dprog" style="margin:6px 0 14px"><span>Выполнено ${done.length} из ${steps.length}</span><span class="tmeta">${p.status === 'paused' ? '<span class="badge">на паузе</span>' : ''}${p.status === 'done' ? '<span class="badge in">завершён</span>' : ''}${p.due ? `<span class="${late ? 'late' : ''}">срок: ${esc(shortDate(p.due))}, ${esc(dueLabel(p.due))}</span>` : ''}</span></div>`;
  if (p.status === 'active' && steps.length && !open.length) html += `<div class="pbanner"><span>Все шаги выполнены.</span><button type="button" class="btn sm" data-act="projStatus" data-id="${p.id}" data-v="done">Завершить проект</button></div>`;
  html += `<div class="qadd"><input id="s-title" placeholder="Новый шаг…" maxlength="120" autocomplete="off" enterkeyhint="done" aria-label="Новый шаг"><button type="button" data-act="stepAdd" aria-label="Добавить шаг">＋</button></div>`;
  html += open.length ? open.map((t, i) => taskRowHtml(t, { noProject: true, move: open.length > 1, next: i === 0 && p.status === 'active' })).join('') : (steps.length ? '' : `<p class="hint">Разбейте проект на шаги: каждый шаг — небольшое конкретное действие. Первый невыполненный станет «следующим шагом» и появится в «Сегодня».</p>`);
  if (done.length) html += `<details class="fold"><summary>Выполненные шаги (${done.length})</summary>${done.map(t => taskRowHtml(t, { noProject: true })).join('')}</details>`;
  html += `<div class="btnrow" style="margin-top:22px">${p.status === 'active' ? `<button type="button" class="btn ghost sm" data-act="projStatus" data-id="${p.id}" data-v="paused">Поставить на паузу</button>` : `<button type="button" class="btn ghost sm" data-act="projStatus" data-id="${p.id}" data-v="active">Вернуть в работу</button>`}${p.status === 'active' ? `<button type="button" class="btn ghost sm" data-act="projStatus" data-id="${p.id}" data-v="done">Завершить</button>` : ''}</div>`;
  box.innerHTML = html;
}
function renderLists() {
  if (ui.tab === 'today') renderTodayList();
  else if (ui.tab === 'cal') { if (ui.person) renderPersonBody(); else if (ui.csub === 'bdays') renderBdaysList(); else renderCalBody(); }
  else if (ui.tab === 'tasks') { if (ui.habit) renderHabitBody(); else if (ui.project) renderProjectBody(); else if (ui.tsub === 'habits') renderHabitsList(); else if (ui.tsub === 'projects') renderProjectsList(); else renderTaskList(); }
}

/* — settings — */
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
/* лимиты в настройках: «обычные» действуют всегда, а на конкретный месяц (в том числе заранее) можно задать свои */
function limitsSettingsHtml() {
  const sc = ui.limScope || '', now = new Date();
  const ks = Array.from({ length: 7 }, (_, i) => { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; });
  if (sc && !ks.includes(sc)) ks.push(sc);
  const ov = sc ? limOv(sc) : null;
  const rows = [{ id: '__total', name: 'Все расходы за месяц', dflt: meta.totalLimit || 0, has: !!ov && hasOwn(ov, 'total'), own: ov ? ov.total : undefined, color: 'var(--primary)' },
    ...meta.cats.filter(c => c.kind === 'out').map(c => ({ id: c.id, name: c.name, dflt: c.limit || 0, has: !!ov && hasOwn(ov.cats, c.id), own: ov && ov.cats ? ov.cats[c.id] : undefined, color: col(c.color) }))];
  const next = sc ? (() => { const [y, m] = sc.split('-').map(Number), d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; })() : '';
  return `<section><h2>Лимиты</h2>
    <p class="hint" style="margin:0 0 12px">Мягкие лимиты расходов на месяц: записи не блокируются, приложение только предупреждает. «Обычные» действуют во все месяцы, а на конкретный месяц можно задать свои заранее.</p>
    <div class="chips" role="group" aria-label="Для какого месяца лимиты" style="margin-bottom:12px">${[['', 'Обычные'], ...ks.map(k => [k, `${MON_S[+k.slice(5) - 1]} ${k.slice(2, 4)}`])].map(([k, l]) => `<button type="button" class="chip ${sc === k ? 'on' : ''}" style="--c:#4C6EF5" data-act="limScope" data-v="${k}" aria-pressed="${sc === k}">${l}</button>`).join('')}</div>

/* подсказка про лимит категории и про лимит карты (мягкая, ничего не блокирует) */
function refreshLimitHint() {
  const el = $('#limhint'); if (!el || !draft || draft.type !== 'tx') return;
  if (draft.kind !== 'out') { el.innerHTML = ''; return; }
  const amt = parseNum($('#f-amount')?.value ?? draft.amount), add = amt > 0 ? amt : 0;
  const dv = $('#f-date')?.value || draft.date, key = isDate(dv) ? mkey(dv) : ui.month;
  const list = (months[key] || []).filter(t => t.id !== draft.id), others = list.filter(t => t.kind === 'out');
  const c = draft.catNew ? null : catById(draft.cat), lines = [];
  const line = (label, spent, limit) => {
    const after = round2(spent + add);
    if (after > limit) lines.push(`<span class="over">${esc(label)}: превышение на ${money(after - limit)}</span>`);
    else if (add && after >= limit * LIMIT_WARN) lines.push(`<span class="warn">${esc(label)}: останется ${money(limit - after)} из ${money(limit)}</span>`);
  };
  const cl = c ? catLimitFor(c, key) : 0, tl = totalLimitFor(key);
  if (c && cl > 0) line(`Лимит «${c.name}»`, sum(others.filter(t => t.cat === c.id), t => t.amount), cl);
  if (tl > 0) line('Общий лимит месяца', monthStats(list).spend, tl);
  const card = draft.src ? debtById(draft.src) : null;
  if (card) {
    const bal = debtBalance(card, draft.id), after = round2(bal + add);
    if (card.limit > 0 && after > card.limit) lines.push(`<span class="over">Кредитка «${esc(card.name)}»: долг станет ${money(after)}, это выше лимита карты ${money(card.limit)}</span>`);
  }
  el.innerHTML = lines.join('');
}

/* — расчёт платежа по долгу: платёж, проценты и остаток связаны между собой — */
function payBalance() { const d = debtById(draft.debt); return d ? debtBalance(d, draft.id) : 0; }
function recomputeAfter() {
  const amt = parseNum(draft.amount) || 0, int = parseNum(draft.interest) || 0;
  draft.after = amt > 0 ? fmtIn(payBalance() - (amt - int)) : '';
}
function initPay() {
  const d = debtById(draft.debt) || debts.find(x => !x.closed) || debts[0];
  if (!d) return;
  draft.debt = d.id;
  if (!draft.id && (draft.amount === '' || draft.amount == null) && d.monthly > 0) draft.amount = fmtIn(d.monthly);
  const amt = parseNum(draft.amount) || 0;
  if (draft.interest === '' || draft.interest == null) {
    const est = estimateInterest(d, draft.date, draft.id);
    draft.estimated = Number.isFinite(est) && amt > 0;
    draft.interest = draft.estimated ? fmtIn(Math.min(est, amt)) : '';
  }
  draft.last = 'int';
  recomputeAfter();
}
function refreshPayCalc(source) {
  if (!draft || draft.kind !== 'pay') return;
  const d = debtById(draft.debt), box = $('#paycalc'); if (!d || !box) return;
  const bal = payBalance(), amt = parseNum($('#f-amount')?.value) || 0;
  const iEl = $('#f-int'), aEl = $('#f-after');
  const lines = [];
  if (source === 'after') {
    const aft = parseNum(aEl.value);
    if (Number.isFinite(aft)) { const int = round2(amt - (bal - aft)); draft.interest = int >= 0 ? fmtIn(Math.min(int, amt)) : ''; iEl.value = draft.interest; if (int < 0) lines.push(`<span class="over">Остаток после платежа не может быть больше, чем ${money(bal)} минус основная часть платежа. Проверьте цифры.</span>`); if (int > amt) lines.push(`<span class="over">Так получается, что проценты больше самого платежа: проверьте остаток.</span>`); }
  } else {
    const int = parseNum(iEl.value) || 0;
    draft.after = amt > 0 ? fmtIn(bal - (amt - int)) : ''; aEl.value = draft.after;
  }
  const int = parseNum(iEl.value) || 0;
  if (amt > 0) {
    if (int > amt) lines.push(`<span class="over">Проценты не могут быть больше суммы платежа.</span>`);
    else {
      const principal = round2(amt - int), after = round2(bal - principal);
      lines.push(`<span class="info">Основной долг уменьшится на ${money(principal)}${int > 0 ? `, ещё ${money(int)} уйдёт на проценты (это ваш расход)` : ''}. Остаток долга: ${money(bal)} → ${money(after)}.</span>`);
      if (after < -0.005) lines.push(`<span class="warn">Платёж больше остатка долга.</span>`);
    }
    if (draft.estimated) lines.push(`<span class="warn">Проценты оценены по ставке за прошедшие дни. Сверьте с графиком банка и при необходимости поправьте.</span>`);
  }
  box.innerHTML = lines.join('');
}
function refreshGoalCalc() {
  const box = $('#goalcalc'); if (!box || !draft || draft.kind !== 'goal') return;
  const g = goalById($('#f-goal')?.value || draft.goal); if (!g) { box.innerHTML = ''; return; }
  const saved = goalSaved(g, draft.id), amt = parseNum($('#f-amount')?.value) || 0;
  const after = round2(saved + (draft.gdir === 'out' ? -amt : amt));
  box.innerHTML = amt > 0 ? (after < 0 ? `<span class="over">Нельзя снять больше накопленного (${money(saved)}).</span>` : `<span class="info">Накоплено: ${money(saved)} → ${money(after)} из ${money(g.target)}. Останется накопить ${money(Math.max(0, g.target - after))}.</span>`) : `<span class="info">Накоплено ${money(saved)} из ${money(g.target)}.</span>`;
}

/* — transaction modal (расход, доход, платёж по долгу, взнос в цель) — */
function openTx(opts = {}) {
  lastFocus = document.activeElement;
  let base = { type: 'tx', id: null, kind: opts.kind || 'out', date: today(), amount: '', cat: '', title: '', store: '', tags: [], note: '', items: [], planId: null, ts: null, src: '', debt: opts.debt || '', interest: '', goal: opts.goal || '', gdir: 'in', owed: opts.owed || '' };
  const ex = opts.id ? findTx(opts.id) : null;
  if (ex) base = Object.assign(base, clone(ex.tx), { oldKey: ex.key });
  else if (opts.prefill) base = Object.assign(base, clone(opts.prefill));
  base.type = 'tx'; base.catNew = false; base.newCatName = '';
  if (base.kind === 'goal' && base.amount < 0 && ex) { base.gdir = 'out'; base.amount = Math.abs(base.amount); }
  base.amount = base.amount === '' || base.amount == null ? '' : fmtIn(base.amount);
  base.interest = base.interest === '' || base.interest == null ? '' : fmtIn(base.interest);
  base.items = Array.isArray(base.items) ? base.items : [];   // позиции чеков из старых версий сохраняем как есть
  base.tags = (base.tags || []).filter(id => tagById(id));
  base.src = base.src || '';
  draft = base;
  if (draft.kind === 'pay') initPay();
  if (draft.kind === 'recv' || draft.kind === 'lend') initOwedTx();
  if (draft.kind === 'goal' && !draft.goal) draft.goal = (goals.find(g => !g.done) || goals[0] || {}).id || '';

  if (!ex && !IS_MOBILE) $('#f-amount')?.focus(); else $('.sheet').focus();
}

function saveOwed() {
  const d = draft, name = (d.oname || '').trim();
  if (!name) return formErr('Введите, кто должен', 'o-name');
  const due = isDate(d.odue) ? d.odue : '', note = (d.onote || '').trim();
  const ex = d.id ? owedById(d.id) : null;
  if (ex) {
    const base = d.obase === '' || d.obase == null ? (ex.base || 0) : parseNum(d.obase);
    if (!(base >= 0)) return formErr('Сумма — число от 0', 'o-base');
    Object.assign(ex, { name, base: round2(base), closed: !!d.oclosed });
    if (due) ex.due = due; else delete ex.due;
    if (note) ex.note = note; else delete ex.note;
    return finish('Сохранено');
  }
  const amt = parseNum(d.oamount); if (!(amt > 0)) return formErr('Введите сумму больше нуля', 'o-amount');
  if (d.omode === 'gave' && !isDate(d.odate)) return formErr('Укажите дату выдачи', 'o-date');
  const o = { id: 'o' + uid(), name, base: d.omode === 'had' ? round2(amt) : 0, start: isDate(d.odate) ? d.odate : today(), color: (owed.length * 5 + 2) % PALETTE.length, closed: false };
  if (due) o.due = due;
  if (note) o.note = note;
  owed.push(o);

async function saveFile(filename, text, mime) {

    const file = new File([text], filename, { type: mime });
    if (IS_MOBILE && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {
    lastFocus = document.activeElement; draft = null; openSheet();
    $('#mcontent').innerHTML = `<div class="mhead"><h2 id="mtitle">${esc(filename)}</h2><button class="icon" data-act="closeModal" aria-label="Закрыть">×</button></div><p class="hint" style="margin:0 0 10px">Не удалось сохранить файл автоматически. Скопируйте текст и вставьте в файл вручную.</p><textarea class="export" readonly>${esc(text)}</textarea>`;
    return false;
  }
}

function initBackGuard() {
  if (!(IS_MOBILE || isStandalone())) return;
  if (history.state && history.state.m) backReady = true;             // страница перезагружена, страховочная запись уже есть
  else {
    // страховочную запись добавляем после первого касания: Chrome пропускает записи, созданные страницей без участия пользователя
    const arm = () => { if (backReady) return; try { history.replaceState({ g: 1 }, ''); history.pushState({ m: 1 }, ''); backReady = true; } catch (e) { /* не критично */ } };
    ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, arm, { once: true, capture: true }));
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (backArmed) disarmBack(); }, true));
  window.addEventListener('popstate', e => {
    if (!backReady) return;
    const st = e.state || {};
    if (st.m) return;                                                  // вернулись на рабочую запись — ничего не делаем
    if ($('#modal-root').firstChild) { closeModal(); try { history.forward(); } catch (x) { /* не критично */ } return; }
    if (ui.tab === 'tasks' && ui.project) { ui.project = null; render(); try { history.forward(); } catch (x) { /* не критично */ } return; }
    if (ui.tab === 'tasks' && ui.habit) { ui.habit = null; render(); try { history.forward(); } catch (x) { /* не критично */ } return; }
    if (ui.tab === 'cal' && ui.person) { ui.person = null; render(); try { history.forward(); } catch (x) { /* не критично */ } return; }
    backArmed = true; toast('Нажмите «Назад» ещё раз, чтобы выйти', '', 2000);
    clearTimeout(backT); backT = setTimeout(disarmBack, 2000);          // не нажали второй раз — возвращаемся на рабочую запись
  });
}
initBackGuard();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !draft && !saveT) location.reload(); });   // новая версия подхватывается сама
}
})();
</script>
