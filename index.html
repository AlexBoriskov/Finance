<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мои финансы</title>
<style>
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#1B2A26; --muted:#5F6E68; --line:#DDE3DD; --soft:#E8EDE7;
  --primary:#2F55E0; --on-primary:#FFFFFF; --income:#12805C; --expense:#C2385A; --plan:#A86B00; --on-plan:#FFFFFF; --goal:#0F7C87;
  --shadow:0 18px 50px rgba(20,40,30,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121816; --surface:#1A2320; --ink:#E6EEEA; --muted:#93A39C; --line:#2B3833; --soft:#222D29;
    --primary:#7D9BFF; --on-primary:#0E1530; --income:#4FD1A1; --expense:#FF7C9C; --plan:#E0AE55; --on-plan:#2A1D00; --goal:#4FC3CF;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.45;font-feature-settings:"tnum" 1;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--income)} .out{color:var(--expense)}
.muted{color:var(--muted)}
.app{max-width:920px;margin:0 auto;padding:0 16px calc(160px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
@media (min-width:720px){.app{padding:env(safe-area-inset-top) 18px 120px}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 6px;flex-wrap:wrap}
.brand{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.savestate{font-size:.78rem;color:var(--muted);text-align:right}
.savestate.err{color:var(--expense);font-weight:600}
.monthnav{display:flex;align-items:center;gap:2px;width:100%;justify-content:space-between;order:3}
@media (min-width:720px){.monthnav{width:auto;order:0}}
.monthnav .label{flex:1;text-align:center;font-weight:700;background:none;border:0;padding:8px;border-radius:10px;font-size:1.02rem}
@media (min-width:720px){.monthnav .label{flex:none;min-width:170px}}
.icon{width:42px;height:42px;border-radius:12px;border:0;background:transparent;font-size:1.4rem;line-height:1;display:inline-grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--soft);color:var(--ink)}
.icon.armed{width:auto;padding:0 12px;font-size:.85rem;font-weight:600;color:var(--expense);background:color-mix(in srgb,var(--expense) 14%,transparent)}

/* nav: bottom bar on phones, top tabs on wide screens */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 2px env(safe-area-inset-bottom)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 1px 8px;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;color:var(--muted);font-size:.68rem;font-weight:600;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--primary);border-top-color:var(--primary)}
@media (min-width:720px){
  .tabs{position:static;background:none;border-top:0;border-bottom:1px solid var(--line);padding:0;margin:8px 0 22px;gap:2px}
  .tab{flex:none;flex-direction:row;font-size:1rem;padding:10px 14px;border-top:0;border-bottom:3px solid transparent;margin:0 0 -1px}
  .tab svg{display:none}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
}
main{margin-top:14px}
@media (min-width:720px){main{margin-top:0}}

/* generic */
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
h3{font-size:.95rem;margin:0 0 6px;font-weight:700}
section{margin:0 0 32px}
.pad{padding:24px 0}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:12px;border:1px solid transparent;background:var(--primary);color:var(--on-primary);padding:10px 18px;font-weight:600;min-height:46px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--expense);border-color:color-mix(in srgb,var(--expense) 50%,transparent)}
.btn.danger.armed{background:var(--expense);color:#fff}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.empty{padding:30px 0;color:var(--muted);max-width:52ch}
.empty p{margin:0 0 14px}
.tag{--c:#748FA1;display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.74rem;font-weight:600;background:var(--soft);color:var(--muted)}
.badge.over{background:color-mix(in srgb,var(--expense) 16%,transparent);color:var(--expense)}
.badge.debt{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:#748FA1;display:inline-flex;align-items:center;min-height:36px;padding:5px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:transparent;font-size:.9rem}
.chip:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip.on{background:color-mix(in srgb,var(--c) 24%,transparent);border-color:var(--c);font-weight:700}
.track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.fill{display:block;height:100%;border-radius:6px}

/* overview */
.figs{display:flex;gap:10px 26px;flex-wrap:wrap;margin-bottom:18px}
.fig{display:flex;flex-direction:column;gap:2px}
.fig .lbl{font-size:.85rem;color:var(--muted)}
.fig .val{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.flow{display:flex;height:46px;gap:3px;border-radius:14px;overflow:hidden}
.flow .seg{min-width:4px;border-radius:5px}
.flow .seg.rest{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border:1px dashed var(--line);border-radius:5px}
.flow.emptybar{background:var(--soft)}
.flowcap{margin:12px 0 14px;font-weight:600}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 26px}
.legend li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--muted);font-size:.82rem;width:38px;text-align:right}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 20px;margin:0;max-width:520px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line)}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:.93rem}
.bars li.click{cursor:pointer}
.bars .sub{display:block;font-size:.76rem;color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:20px}
.banner p{margin:0 0 10px;font-weight:600}
.banner.alert{border-color:color-mix(in srgb,var(--expense) 55%,transparent);background:color-mix(in srgb,var(--expense) 8%,var(--surface))}
.banner.alert p{margin:0 0 6px;color:var(--expense)}
.alist{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.93rem}

/* limits */
.lims{list-style:none;margin:0;padding:0}
.lim{padding:10px 0;border-bottom:1px solid var(--line)}
.lim-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:.95rem}
.lim-head .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lim.over .nm{color:var(--expense)}
.lim-note{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;margin-top:5px}
.lim-note.muted{display:block}
.limhint,.paycalc{margin:-4px 0 12px;font-size:.86rem;display:flex;flex-direction:column;gap:2px}
.limhint:empty,.paycalc:empty{display:none}
.limhint .over,.paycalc .over{color:var(--expense);font-weight:600}
.limhint .warn,.paycalc .warn{color:var(--plan);font-weight:600}
.limhint .info,.paycalc .info{color:var(--muted)}

/* plans timeline on overview */
.tl{list-style:none;margin:0;padding:0}
.tlrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0}
.tlrow:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tl-date{display:flex;flex-direction:column;width:78px;flex:none;line-height:1.25}
.tl-date b{font-size:.95rem}
.tl-date small{font-size:.74rem;color:var(--muted)}
.tl-amt{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none}
.tl-amt small{font-size:.76rem}
.warnline{color:var(--plan);font-weight:600}
.late{color:var(--expense)!important;font-weight:600}

/* forecast */
.trend{width:100%;height:auto;display:block}
.trend text{fill:var(--muted);font-size:13px;font-family:inherit}
.trend .bi{fill:var(--income)} .trend .bo{fill:var(--expense)}
.trend .pi{stroke:var(--income);stroke-width:1.2} .trend .po{stroke:var(--expense);stroke-width:1.2}
.trend .pbi{fill:var(--income);opacity:.14} .trend .pli{fill:var(--income);opacity:.55}
.trend .pbo{fill:var(--expense);opacity:.14} .trend .plo{fill:var(--expense);opacity:.55}
.trend .cur{fill:var(--soft)}
.tlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin:6px 0 12px}
.tlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tlegend i.solid{background:var(--muted)}
.tlegend i.hatch{border:1px solid var(--muted);background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 5px)}
.ftable{width:100%;border-collapse:collapse;font-size:.9rem}
.ftable th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px 4px 0;font-size:.82rem}
.ftable td{padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.ftable .r{text-align:right}
.ftable td:last-child,.ftable th:last-child{padding-right:0}
.ftable small{display:block;font-size:.72rem;color:var(--muted)}

/* lists */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;max-width:100%}
.toolbar input[type=search]{flex:1 1 100%;min-width:150px}
@media (min-width:720px){.toolbar input[type=search]{flex:1 1 200px}}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg2 button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted);min-height:42px}
.seg2 button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg2.kind{display:flex}
.seg2.kind button{flex:1;padding:8px 4px}
.seg2.kind button[aria-pressed="true"].k-out{background:var(--expense);color:#fff}
.seg2.kind button[aria-pressed="true"].k-in{background:var(--income);color:#fff}
.seg2.kind button[aria-pressed="true"].k-pay{background:var(--primary);color:var(--on-primary)}
.seg2.kind button[aria-pressed="true"].k-goal{background:var(--goal);color:#fff}
.dayhead{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);padding:14px 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.row:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.83rem;color:var(--muted)}
.amt{font-weight:700}
.amt.goal{color:var(--goal)}
.plan-row{border-bottom:1px solid var(--line)}
.plan-row .row{border:0}
.plan-actions{display:flex;gap:8px;padding:0 0 10px 22px}
details.fold{margin-top:22px}
details.fold summary{cursor:pointer;font-weight:700;padding:8px 0}
.done-row{opacity:.62}

/* debts & goals */
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sechead h2{margin:0}
.dcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.dname{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700;font-size:1.02rem}
.dname .dot{width:12px;height:12px;border-radius:50%;flex:none}
.dname span.t{overflow:hidden;text-overflow:ellipsis}
.dbal{text-align:right;flex:none}
.dbal b{display:block;font-size:1.35rem;letter-spacing:-.01em}
.dbal small{font-size:.76rem;color:var(--muted)}
.dcard .track{height:12px;margin:2px 0 6px}
.dprog{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px 0 0;font-size:.88rem}
@media (max-width:420px){.dgrid{grid-template-columns:1fr}}
.dgrid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.dgrid dt{color:var(--muted)} .dgrid dd{margin:0;font-weight:600;text-align:right}
.dfc{margin:12px 0 0;font-size:.9rem;padding:10px 12px;background:var(--soft);border-radius:10px}
.dfc.warn{background:color-mix(in srgb,var(--plan) 14%,transparent);color:var(--plan);font-weight:600}
.dactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.extra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:.88rem}
.extra input{width:110px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);text-align:right}
.extra .res{flex-basis:100%;color:var(--ink)}
.dtotal{display:flex;gap:10px 26px;flex-wrap:wrap;margin-bottom:16px}
.dtotal div{display:flex;flex-direction:column}
.dtotal small{font-size:.8rem;color:var(--muted)}
.dtotal b{font-size:1.25rem}

/* settings */
.setlist{list-style:none;margin:0 0 12px;padding:0}
.setrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.setrow input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;min-height:42px}
.setrow input:hover{border-color:var(--line)}
.setrow input.limin{flex:none;width:92px;text-align:right;border-color:var(--line);background:var(--surface)}
.setrow .cnt{font-size:.8rem;color:var(--muted);min-width:20px;text-align:right}
.dotbtn{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media (max-width:720px){.two{grid-template-columns:1fr;gap:0}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:.85rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.field input[type=checkbox]{width:22px;height:22px;min-height:0}
.field.check{flex-direction:row;align-items:center;gap:10px}
.field textarea{min-height:64px;resize:vertical}
.field .mt{margin-top:8px}
.setinline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.setinline input{width:150px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.notice{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.notice.warn{border:1px solid color-mix(in srgb,var(--plan) 55%,transparent)}
details.help{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px;background:var(--surface)}
details.help summary{cursor:pointer;font-weight:600}
details.help p,details.help ol{margin:8px 0 0;font-size:.92rem}
details.help ol{padding-left:20px}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:0 22px 0 16px;height:56px;background:var(--primary);color:var(--on-primary);font-weight:700;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}
@media (min-width:720px){.fab{bottom:24px;right:max(18px,calc((100vw - 920px)/2 + 18px))}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,12,.55);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);max-height:94vh;max-height:94dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .18s ease-out}
@media (min-width:720px){.sheet{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:22px;max-height:90vh;padding:20px;animation:none}}
@keyframes up{from{transform:translate(-50%,24px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h2{margin:0;font-size:1.2rem}
.amountwrap{display:flex;align-items:baseline;gap:10px}
.amountwrap input{font-size:1.8rem;font-weight:800;min-height:58px}
.amountwrap .curs{font-size:1.4rem;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.addtag{display:flex;gap:8px;margin-top:10px}
.addtag input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.ferr{color:var(--expense);font-size:.88rem;font-weight:600;margin:6px 0 0;min-height:1em}
.mfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.mfoot .right{display:flex;gap:10px;margin-left:auto}
textarea.export{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;z-index:60;width:max-content;max-width:92vw;text-align:center;white-space:pre-line;transition:opacity .16s,transform .16s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--expense);color:#fff}
#toast.warn{background:var(--plan);color:var(--on-plan)}
@media (min-width:720px){#toast{bottom:96px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">

<script>
(() => {
'use strict';

/* ───────── helpers ───────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const parseNum = v => {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v ?? '').replace(/[\s\u00A0]/g, '').replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
};
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(new Date(s + 'T00:00:00'));
const mkey = s => s.slice(0, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (arr, f = x => x) => round2(arr.reduce((a, x) => a + f(x), 0));
const plural = (n, f) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; };
const fmtIn = x => String(round2(x)).replace('.', ',');
const DAYW = ['день', 'дня', 'дней'];

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monthTitle = k => { const [y, m] = k.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const dayTitle = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' }); };
const shortDate = ds => { const [y, m, d] = ds.split('-').map(Number); return `${d} ${MON_S[m - 1]}${y !== new Date().getFullYear() ? ' ' + y : ''}`; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const monthYear = (offset) => { const n = new Date(); const d = new Date(n.getFullYear(), n.getMonth() + offset, 1); return `${MON_S[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMonths = n => { const y = Math.floor(n / 12), m = n % 12; return [y ? `${y} ${plural(y, ['год', 'года', 'лет'])}` : '', m ? `${m} мес.` : ''].filter(Boolean).join(' ') || 'меньше месяца'; };

const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = x => { x = round2(x); return Number.isInteger(x) ? nf0.format(x) : nf2.format(x); };

const PALETTE = ['#4C6EF5','#12B886','#F59F00','#E64980','#7950F2','#15AABF','#FA5252','#82C91E','#FD7E14','#3B5BDB','#AE3EC9','#748FA1'];
const col = i => PALETTE[((i ?? 11) % PALETTE.length + PALETTE.length) % PALETTE.length];
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') || ((navigator.maxTouchPoints || 0) > 1 && /Mac/i.test(navigator.platform || ''));
const LIMIT_WARN = 0.8;
const INT_CAT = '__int';   // «Проценты по долгам» — служебная категория расходов

/* ───────── data ───────── */
const DEF_OUT = ['Продукты','Кафе и рестораны','Жильё и коммуналка','Транспорт','Связь и интернет','Здоровье','Одежда и обувь','Дом и быт','Развлечения','Образование','Подарки','Налоги и сборы','Прочее'];
const DEF_IN = ['Зарплата','Подработка','Подарки','Возврат и кэшбэк','Проценты и дивиденды','Прочее'];
const DEBT_KINDS = { mortgage: 'Ипотека', loan: 'Кредит', card: 'Кредитная карта' };
function defaultMeta() {
  const cats = [];
  DEF_OUT.forEach((n, i) => cats.push({ id: 'e' + i, kind: 'out', name: n, color: i % PALETTE.length }));
  DEF_IN.forEach((n, i) => cats.push({ id: 'i' + i, kind: 'in', name: n, color: (i + 3) % PALETTE.length }));
  return { currency: null, opening: 0, totalLimit: 0, lastBackup: null, cats, tags: [{ id: 't0', name: 'Важно', color: 6 }, { id: 't1', name: 'Можно отложить', color: 11 }] };
}
let meta = defaultMeta();
let plans = [];      // {id, kind:'in'|'out', title, amount, cat, tags, date, note, status, txId, ts}
let months = {};     // 'YYYY-MM' -> [tx]
let debts = [];      // {id, kind:'mortgage'|'loan'|'card', name, balance0, start, rate?, monthly?, payDay?, limit?, color, closed, adj:[{id,date,delta}]}
let goals = [];      // {id, name, target, saved0, deadline?, color, done}
/* tx.kind: 'in' доход | 'out' расход (src = id кредитки, если оплачено ею) |
            'pay' платёж по долгу (debt, interest — часть платежа на проценты) | 'goal' взнос в цель (goal; сумма со знаком: минус — снятие) */

const money = (x, signed) => {
  x = round2(x);
  const s = num(Math.abs(x)) + (meta.currency ? '\u00A0' + meta.currency : '');
  if (x < 0) return '−' + s;
  return signed && x > 0 ? '+' + s : s;
};
const catById = id => meta.cats.find(c => c.id === id);
const catName = id => id === INT_CAT ? 'Проценты по долгам' : (catById(id)?.name || 'Без категории');
const catColor = id => id === INT_CAT ? col(6) : col(catById(id)?.color);
const tagById = id => meta.tags.find(t => t.id === id);
const debtById = id => debts.find(d => d.id === id);
const goalById = id => goals.find(g => g.id === id);
const allTx = () => Object.values(months).flat();
const findTx = id => { for (const [key, list] of Object.entries(months)) { const tx = list.find(t => t.id === id); if (tx) return { tx, key }; } return null; };
/* влияние записи на свободные деньги: покупка кредиткой деньги не тратит, платёж по долгу и взнос в цель — тратят */
const cashDelta = t => t.kind === 'in' ? t.amount : t.kind === 'out' ? (t.src ? 0 : -t.amount) : (t.kind === 'pay' || t.kind === 'goal') ? -t.amount : 0;
const balance = () => round2((meta.opening || 0) + allTx().reduce((a, t) => a + cashDelta(t), 0));
const openPlans = () => plans.filter(p => p.status === 'open');
const catUsage = id => allTx().filter(t => t.cat === id).length + plans.filter(p => p.cat === id).length;
const tagUsage = id => allTx().filter(t => (t.tags || []).includes(id)).length + plans.filter(p => (p.tags || []).includes(id)).length;
const tagChipsHtml = ids => (ids || []).map(id => tagById(id)).filter(Boolean).map(g => `<span class="tag" style="--c:${col(g.color)}">${esc(g.name)}</span>`).join('');

/* — долги — */
function debtBalance(d, exclId) {
  let b = d.balance0 || 0;
  for (const t of allTx()) {
    if (t.id === exclId) continue;
    if (t.kind === 'out' && t.src === d.id) b += t.amount;                        // покупка в кредит увеличивает долг
    else if (t.kind === 'pay' && t.debt === d.id) b -= t.amount - (t.interest || 0);   // основной долг уменьшается только на непроцентную часть
  }
  for (const a of d.adj || []) b += a.delta;
  return round2(b);
}
function debtStats(d) {
  let principal = 0, interest = 0, charges = 0, last = null;
  for (const t of allTx()) {
    if (t.kind === 'out' && t.src === d.id) charges += t.amount;
    else if (t.kind === 'pay' && t.debt === d.id) { principal += t.amount - (t.interest || 0); interest += t.interest || 0; if (!last || t.date > last) last = t.date; }
  }
  return { balance: debtBalance(d), principal: round2(principal), interest: round2(interest), charges: round2(charges), last };
}
const debtUsage = d => allTx().filter(t => t.debt === d.id || t.src === d.id).length;
const goalUsage = g => allTx().filter(t => t.kind === 'goal' && t.goal === g.id).length;
function goalSaved(g, exclId) {
  let s = g.saved0 || 0;
  for (const t of allTx()) if (t.kind === 'goal' && t.goal === g.id && t.id !== exclId) s += t.amount;
  return round2(s);
}
/* оценка процентов за период с прошлого платежа (по факту дней, год = 365) — подсказка, точные цифры берутся из графика банка */
function estimateInterest(d, date, exclId) {
  if (!(d.rate > 0)) return NaN;
  let last = d.start || date;
  for (const t of allTx()) if (t.kind === 'pay' && t.debt === d.id && t.id !== exclId && t.date < date && t.date > last) last = t.date;
  let days = daysBetween(last, date); if (!(days > 0)) days = 30; if (days > 366) days = 366;
  return round2(debtBalance(d, exclId) * d.rate / 100 * days / 365);
}
/* аннуитетный прогноз: сколько месяцев и процентов осталось при данном платеже */
function amortize(bal, ratePct, pay) {
  if (bal <= 0.005) return { ok: true, months: 0, interest: 0 };
  if (!(pay > 0)) return { ok: false, reason: 'nopay' };
  const r = (ratePct || 0) / 100 / 12;
  if (r > 0 && pay <= bal * r + 0.005) return { ok: false, reason: 'low', monthlyInterest: round2(bal * r) };
  let months = 0, interest = 0;
  while (bal > 0.005 && months < 1200) { const i = bal * r; interest += i; bal = bal + i - pay; months++; }
  if (months >= 1200) return { ok: false, reason: 'long' };
  return { ok: true, months, interest: round2(interest) };
}
/* ближайшие платежи по графику долгов (текущий месяц + два следующих), если платёж за месяц ещё не внесён */
function scheduledPayments() {
  const out = [], now = new Date();
  debts.filter(d => !d.closed && d.monthly > 0 && d.payDay >= 1 && debtBalance(d) > 0.005).forEach(d => {
    for (let i = 0; i < 3; i++) {
      const base = new Date(now.getFullYear(), now.getMonth() + i, 1);
      const day = Math.min(d.payDay, new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate());
      const date = `${base.getFullYear()}-${pad(base.getMonth() + 1)}-${pad(day)}`;
      if ((months[mkey(date)] || []).some(t => t.kind === 'pay' && t.debt === d.id)) continue;
      out.push({ sched: true, debt: d, date, kind: 'out', amount: d.monthly, title: `Платёж: ${d.name}` });
    }
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/* ───────── storage: localStorage on this device ───────── */
const LS_KEY = 'fin-ledger-v1';
let volatile = false, memRaw = null, saveT = null, persistAsked = false;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { volatile = true; return k === LS_KEY ? memRaw : null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { volatile = true; if (k === LS_KEY) memRaw = v; return false; } }

function exportObj() {
  return { app: 'fin-ledger', v: 1, exported: new Date().toISOString(), meta: { currency: meta.currency, opening: meta.opening || 0, totalLimit: meta.totalLimit || 0, lastBackup: meta.lastBackup || null, cats: meta.cats, tags: meta.tags }, plans, debts, goals, months };
}
function setSave(state) {
  const el = $('#savestate'); if (!el) return;
  el.className = 'savestate' + (state === 'error' ? ' err' : '');
  el.textContent = state === 'saving' ? 'Сохраняю…' : state === 'error' ? 'Не сохраняется — сделайте копию' : 'Сохранено на устройстве';
}
function persist() { setSave('saving'); clearTimeout(saveT); saveT = setTimeout(saveNow, 150); }
function saveNow() {
  clearTimeout(saveT); saveT = null;
  const ok = lsSet(LS_KEY, JSON.stringify(exportObj()));
  setSave(ok ? 'saved' : 'error');
  if (ok && !persistAsked) { persistAsked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* не критично */ } }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveT) saveNow(); });
window.addEventListener('pagehide', () => { if (saveT) saveNow(); });

const TX_KINDS = ['in', 'out', 'pay', 'goal'];
function hydrate(obj) {
  const dm = defaultMeta();
  meta = Object.assign(dm, obj.meta || {});
  if (!Array.isArray(meta.cats) || !meta.cats.length) meta.cats = dm.cats;
  if (!Array.isArray(meta.tags)) meta.tags = dm.tags;
  if (meta.currency === undefined) meta.currency = null;
  if (!(meta.totalLimit > 0)) meta.totalLimit = 0;
  plans = Array.isArray(obj.plans) ? obj.plans.filter(p => p && p.id && (p.kind === 'in' || p.kind === 'out') && Number.isFinite(p.amount)) : [];
  debts = Array.isArray(obj.debts) ? obj.debts.filter(d => d && d.id && d.name && Number.isFinite(d.balance0)).map(d => ({ ...d, adj: Array.isArray(d.adj) ? d.adj.filter(a => a && Number.isFinite(a.delta)) : [] })) : [];
  goals = Array.isArray(obj.goals) ? obj.goals.filter(g => g && g.id && g.name && g.target > 0) : [];
  months = {};
  for (const [k, list] of Object.entries(obj.months || {})) {
    if (!/^\d{4}-\d{2}$/.test(k) || !Array.isArray(list)) continue;
    months[k] = list.filter(t => t && t.id && TX_KINDS.includes(t.kind) && isDate(t.date) && Number.isFinite(t.amount));
  }
}
function loadState() {
  const raw = lsGet(LS_KEY); let obj = null;
  if (raw) { try { obj = JSON.parse(raw); } catch (e) { lsSet('fin-ledger-corrupt', raw); toast('Сохранённые данные повреждены. Копия оставлена, начинаем заново.', 'err'); } }
  hydrate(obj || {});
}
window.addEventListener('storage', e => { if (e.key === LS_KEY && !draft && !saveT) { loadState(); render(); } });

/* ───────── ui state ───────── */
const ui = { tab: 'overview', month: mkey(today()), f: { kind: 'all', cat: '', tag: '', q: '' }, planTag: '', extra: {} };
let draft = null, lastFocus = null, pendingImport = null;

let toastT;
function toast(msg, kind, ms) {
  const el = $('#toast'); if (!el) return; el.textContent = msg; el.className = 'show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => { el.className = ''; }, ms || 3800);
}
function twoStep(btn, run, label) {
  if (btn.dataset.armed) { clearTimeout(+btn.dataset.t); run(); return; }
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label || 'Точно?'; btn.classList.add('armed');
  btn.dataset.t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); }, 3500);
}

/* ───────── aggregation ───────── */
/* Расходы месяца = траты (своими деньгами и кредиткой) + проценты по долгам.
   Основная часть платежей по долгам и взносы в цели — не расходы, показываются отдельно. */
function monthStats(list) {
  let inc = 0, spend = 0, principal = 0, interest = 0, goal = 0;
  for (const t of list) {
    if (t.kind === 'in') inc += t.amount;
    else if (t.kind === 'out') spend += t.amount;
    else if (t.kind === 'pay') { interest += t.interest || 0; principal += t.amount - (t.interest || 0); }
    else if (t.kind === 'goal') goal += t.amount;
  }
  spend += interest;
  return { inc: round2(inc), spend: round2(spend), principal: round2(principal), interest: round2(interest), goal: round2(goal), net: round2(inc - spend) };
}
function groupCats(list, kind) {
  const m = new Map();
  for (const t of list) if (t.kind === kind) m.set(t.cat || '', (m.get(t.cat || '') || 0) + t.amount);
  if (kind === 'out') { const i = sum(list.filter(t => t.kind === 'pay'), t => t.interest || 0); if (i > 0) m.set(INT_CAT, i); }
  return [...m].map(([id, amt]) => ({ id, name: catName(id), color: catColor(id), amt: round2(amt) })).sort((a, b) => b.amt - a.amt);
}
function groupTags(list) {
  const m = new Map();
  for (const t of list) if (t.kind === 'out') for (const id of (t.tags || [])) if (tagById(id)) m.set(id, (m.get(id) || 0) + t.amount);
  return [...m].map(([id, amt]) => ({ id, name: tagById(id).name, color: col(tagById(id).color), amt: round2(amt) })).sort((a, b) => b.amt - a.amt);
}
const backupDue = () => allTx().length >= 5 && (!meta.lastBackup || daysBetween(meta.lastBackup.slice(0, 10), today()) > 30);
const byPlanDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.ts || 0) - (b.ts || 0);

/* — мягкие лимиты: только предупреждают, записи не блокируют — */
function limitRows(key) {
  const list = months[key] || [], out = list.filter(t => t.kind === 'out');
  const inMonth = p => p.status === 'open' && p.kind === 'out' && p.date && mkey(p.date) === key;
  const rows = [];
  if (meta.totalLimit > 0) rows.push({ id: '', name: 'Все расходы за месяц', spent: monthStats(list).spend, limit: meta.totalLimit, planned: sum(plans.filter(inMonth), p => p.amount), color: 'var(--primary)', total: true });
  meta.cats.filter(c => c.kind === 'out' && c.limit > 0).forEach(c => rows.push({ id: c.id, name: c.name, spent: sum(out.filter(t => t.cat === c.id), t => t.amount), limit: c.limit, planned: sum(plans.filter(p => inMonth(p) && p.cat === c.id), p => p.amount), color: col(c.color) }));
  rows.forEach(r => { r.ratio = r.spent / r.limit; });
  return [...rows.filter(r => r.total), ...rows.filter(r => !r.total).sort((a, b) => b.ratio - a.ratio)];
}
function limitMessages(tx) {
  const list = months[mkey(tx.date)] || [], out = list.filter(t => t.kind === 'out'), msgs = [];
  const c = catById(tx.cat);
  const check = (label, spent, limit) => {
    if (spent > limit) msgs.push(`${label}: превышение на ${money(spent - limit)}`);
    else if (spent >= limit * LIMIT_WARN) msgs.push(`${label}: использовано ${Math.round(spent / limit * 100)}% лимита`);
  };
  if (c && c.limit > 0) check(`Лимит «${c.name}»`, sum(out.filter(t => t.cat === c.id), t => t.amount), c.limit);
  if (meta.totalLimit > 0) check('Общий лимит', monthStats(list).spend, meta.totalLimit);
  return msgs;
}

/* — прогноз денег: текущий месяц и два следующих; факт + планы + платежи по графику долгов — */
function forecastData() {
  const n = new Date(), keys = [];
  for (let i = 0; i < 3; i++) { const d = new Date(n.getFullYear(), n.getMonth() + i, 1); keys.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }
  const open = openPlans().filter(p => p.date), sched = scheduledPayments();
  return keys.map((k, i) => {
    const list = months[k] || [];
    const inBucket = p => mkey(p.date) === k || (i === 0 && mkey(p.date) < k);   // просроченное — в текущий месяц
    const pl = open.filter(inBucket), sp = sched.filter(inBucket);
    const [y, m] = k.split('-').map(Number);
    return { k, m: m - 1, y,
      inc: sum(list.filter(t => t.kind === 'in'), t => t.amount),
      out: sum(list.filter(t => t.kind === 'out' || t.kind === 'pay'), t => t.kind === 'out' ? (t.src ? 0 : t.amount) : t.amount),
      pIn: sum(pl.filter(p => p.kind === 'in'), p => p.amount),
      pOut: round2(sum(pl.filter(p => p.kind === 'out'), p => p.amount) + sum(sp, p => p.amount)) };
  });
}

/* компактная сводка долгов и целей на «Обзоре» */

    html += `<p class="hint" style="margin:0 0 4px">Долгов всего: <b class="num">${money(total)}</b>. Полоска показывает, какая часть долга ещё осталась.</p><ul class="bars">${od.map(d => {
      const bal = debtBalance(d), ref = d.kind === 'card' ? (d.limit > 0 ? d.limit : Math.max(d.balance0, bal)) : Math.max(d.balance0, bal);

}

/* планы и платежи по долгам списком по датам, с нарастающим балансом */
function plansTimelineHtml() {
  const open = openPlans(), sched = scheduledPayments(), bal = balance();
  if (!allTx().length && !meta.opening && !open.length && !sched.length) return '';
  const dated = [...open.filter(p => p.date), ...sched].sort(byPlanDate), undated = open.filter(p => !p.date).sort(byPlanDate);
  const row = (p, running) => {
    const diff = p.date ? daysBetween(today(), p.date) : null;
    const rel = diff === null ? '' : diff < 0 ? `просрочено на ${-diff} ${plural(-diff, DAYW)}` : diff === 0 ? 'сегодня' : diff === 1 ? 'завтра' : `через ${diff} ${plural(diff, DAYW)}`;
    const attrs = p.sched ? `data-act="paySched" data-debt="${p.debt.id}" data-date="${p.date}"` : `data-act="editPlan" data-id="${p.id}"`;
    return `<li><button class="tlrow" ${attrs}>
      <span class="tl-date"><b>${p.date ? esc(shortDate(p.date)) : '—'}</b>${rel ? `<small class="${diff < 0 ? 'late' : ''}">${rel}</small>` : ''}</span>
      <span class="row-main"><span class="row-title">${esc(p.title || catName(p.cat))}</span><span class="row-sub">${p.sched ? '<span class="badge debt">платёж по графику</span>' : `<span>${esc(catName(p.cat))}</span>${tagChipsHtml(p.tags)}`}</span></span>
      <span class="tl-amt"><span class="amt num ${p.kind}">${p.kind === 'in' ? '+' : '−'}${money(p.amount)}</span>${running !== undefined ? `<small class="num ${running < 0 ? 'out' : 'muted'}">баланс ${money(running)}</small>` : ''}</span></button></li>`;
  };
  let run = bal; const shownRows = []; let firstNeg = null;
  dated.forEach(p => { run = round2(run + (p.kind === 'in' ? p.amount : -p.amount)); if (run < 0 && !firstNeg) firstNeg = { p, run }; shownRows.push({ p, run }); });
  const LIM = 10;
  let html = `<section><h2>Баланс и ближайшие платежи</h2><dl class="kv" style="margin-bottom:8px"><dt>Свободные деньги сейчас</dt><dd class="num ${bal < 0 ? 'out' : ''}">${money(bal)}</dd></dl>`;
  if (shownRows.length) html += `<ul class="tl">${shownRows.slice(0, LIM).map(r => row(r.p, r.run)).join('')}</ul>`;
  if (shownRows.length > LIM) html += `<p class="hint">Ещё ${shownRows.length - LIM} — на вкладке «Планы».</p>`;
  if (firstNeg) html += `<p class="hint warnline">К ${esc(shortDate(firstNeg.p.date))} баланс по планам уходит в минус (${money(firstNeg.run)}).</p>`;
  if (undated.length) html += `<h3 style="margin-top:16px">Без срока</h3><ul class="tl">${undated.slice(0, 5).map(p => row(p)).join('')}</ul>${undated.length > 5 ? `<p class="hint">И ещё ${undated.length - 5} — на вкладке «Планы».</p>` : ''}`;
  if (open.length || sched.length) {
    const pOut = sum(open.filter(p => p.kind === 'out'), p => p.amount), pIn = sum(open.filter(p => p.kind === 'in'), p => p.amount), sOut = sum(sched, p => p.amount), after = round2(bal - pOut + pIn - sOut);
    html += `<dl class="kv" style="margin-top:14px">${pOut ? `<dt>Запланированные расходы</dt><dd class="num out">−${money(pOut)}</dd>` : ''}${pIn ? `<dt>Запланированные доходы</dt><dd class="num in">+${money(pIn)}</dd>` : ''}${sOut ? `<dt>Платежи по долгам (3 месяца)</dt><dd class="num out">−${money(sOut)}</dd>` : ''}<div class="sep"></div><dt>После всех планов и платежей</dt><dd class="num ${after < 0 ? 'out' : ''}">${money(after)}</dd></dl>
      <p class="hint"><button class="chip" data-act="tab" data-v="plans">Все планы</button></p>`;
  } else html += `<p class="hint">Планов пока нет. Добавьте их на вкладке «Планы», и здесь появится список по датам.</p>`;
  return html + '</section>';
}

function forecastHtml() {
  const data = forecastData();
  const max = Math.max(1, ...data.flatMap(d => [d.inc + d.pIn, d.out + d.pOut]));
  const W = 600, H = 176, base = 142, top = 14, bw = 44, gap = 6, cw = W / 3, sc = (base - top) / max;
  let s = `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Поступления и выплаты на три месяца, включая планы и платежи по долгам">
    <defs><pattern id="hin" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="pbi" width="7" height="7"/><rect class="pli" width="3" height="7"/></pattern>
    <pattern id="hout" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="pbo" width="7" height="7"/><rect class="plo" width="3" height="7"/></pattern></defs>`;
  data.forEach((d, i) => {
    const cx = (i + .5) * cw, xi = cx - bw - gap / 2, xo = cx + gap / 2;
    const fi = d.inc * sc, pi = d.pIn * sc, fo = d.out * sc, po = d.pOut * sc;
    if (d.k === ui.month) s += `<rect class="cur" x="${i * cw + 4}" y="0" width="${cw - 8}" height="${H}" rx="12"/>`;
    if (fi > 0) s += `<rect class="bi" x="${xi}" y="${base - fi}" width="${bw}" height="${Math.max(fi, 2)}" rx="4"/>`;
    if (pi > 0) s += `<rect class="pi" fill="url(#hin)" x="${xi}" y="${base - fi - pi}" width="${bw}" height="${Math.max(pi, 2)}" rx="4"><title>План: поступления ${esc(money(d.pIn))}</title></rect>`;
    if (fo > 0) s += `<rect class="bo" x="${xo}" y="${base - fo}" width="${bw}" height="${Math.max(fo, 2)}" rx="4"/>`;
    if (po > 0) s += `<rect class="po" fill="url(#hout)" x="${xo}" y="${base - fo - po}" width="${bw}" height="${Math.max(po, 2)}" rx="4"><title>План: выплаты ${esc(money(d.pOut))}</title></rect>`;
    s += `<text x="${cx}" y="${H - 12}" text-anchor="middle">${MON_S[d.m]}${i === 0 ? ' · сейчас' : ''}</text>`;
  });
  s += '</svg>';
  const undated = openPlans().filter(p => !p.date).length;
  return `<section><h2>Ближайшие три месяца</h2>${s}
    <div class="tlegend"><span><i class="solid"></i>Записано</span><span><i class="hatch"></i>Планы и платежи по долгам</span></div>
    <table class="ftable"><thead><tr><th>Месяц</th><th class="r">Поступления</th><th class="r">Выплаты</th><th class="r">Итог</th></tr></thead><tbody>
    ${data.map(d => { const net = round2(d.inc + d.pIn - d.out - d.pOut);
      return `<tr><td>${MONTHS[d.m]}</td>
      <td class="r num in">${money(d.inc + d.pIn)}${d.pIn ? `<small>из них план ${money(d.pIn)}</small>` : ''}</td>
      <td class="r num out">${money(d.out + d.pOut)}${d.pOut ? `<small>из них план ${money(d.pOut)}</small>` : ''}</td>
      <td class="r num ${net < 0 ? 'out' : 'in'}">${money(net, true)}</td></tr>`; }).join('')}</tbody></table>
    <p class="hint">«Выплаты» — деньги, которые уходят со счёта: траты своими деньгами и платежи по долгам. Покупки кредиткой попадут сюда, когда вы будете гасить карту.${undated ? ' Планы без срока в прогноз не входят.' : ''}</p></section>`;
}

function viewOverview(root) {
  const list = months[ui.month] || [];
  const st = monthStats(list);
  const segs = groupCats(list, 'out');
  const goalPos = Math.max(0, st.goal), used = round2(st.spend + st.principal + goalPos), base = Math.max(st.inc, used);
  const lims = limitRows(ui.month), overs = lims.filter(l => l.spent > l.limit);
  const overCats = new Set(overs.map(l => l.id).filter(Boolean));
  let html = meta.currency == null ? curBanner() : '';
  if (backupDue()) html += `<div class="banner"><p>Сделайте резервную копию: данные хранятся только на этом устройстве.</p><button class="btn sm" data-act="exportJson">Сохранить копию</button></div>`;
  if (overs.length) html += `<div class="banner alert"><p>Превышены лимиты</p><div class="alist">${overs.map(l => `<span>${esc(l.name)} <b class="out num">+${money(l.spent - l.limit)}</b></span>`).join('')}</div></div>`;

  const pct = x => Math.round(x / (st.inc || 1) * 100);
  let bar = '', cap = '';
  if (base > 0) {
    bar = segs.map(s => `<span class="seg" style="flex:${s.amt};background:${s.color}" title="${esc(s.name)}: ${esc(money(s.amt))}"></span>`).join('');
    if (st.principal > 0) bar += `<span class="seg" style="flex:${st.principal};background:var(--primary)" title="Погашение долгов: ${esc(money(st.principal))}"></span>`;
    if (goalPos > 0) bar += `<span class="seg" style="flex:${goalPos};background:var(--goal)" title="В цели: ${esc(money(goalPos))}"></span>`;
    if (st.inc > used) bar += `<span class="seg rest" style="flex:${round2(st.inc - used)}" title="Свободно"></span>`;
    if (st.inc === 0) cap = `Доходов в этом месяце не записано. Расходы ${money(st.spend)}${st.principal ? `, в погашение долгов ${money(st.principal)}` : ''}`;
    else if (st.inc >= used) cap = [`Потрачено ${pct(st.spend)}% доходов`, st.principal ? `в долги ${pct(st.principal)}%` : '', goalPos ? `в цели ${pct(goalPos)}%` : '', `осталось ${money(st.inc - used)}`].filter(Boolean).join(', ');
    else cap = `Расходов и платежей больше доходов на ${money(used - st.inc)}`;
    if (st.spend === 0 && st.principal === 0 && goalPos === 0) cap = `Расходов пока нет — доходы ${money(st.inc)}`;
  } else cap = 'В этом месяце пока нет записей.';
  const legendExtra = [];
  if (st.principal > 0) legendExtra.push({ name: 'Погашение долгов', color: 'var(--primary)', amt: st.principal });
  if (goalPos > 0) legendExtra.push({ name: 'Взносы в цели', color: 'var(--goal)', amt: goalPos });
  const pctBase = base || 1;
  const usesDebt = st.principal > 0 || st.interest > 0 || goalPos > 0 || list.some(t => t.kind === 'out' && t.src);
  html += `<section aria-label="Куда ушли доходы">
    <div class="figs">
      <div class="fig"><span class="lbl">Доходы</span><span class="val in num">${money(st.inc)}</span></div>
      <div class="fig"><span class="lbl">Расходы</span><span class="val out num">${money(st.spend)}</span></div>
      <div class="fig"><span class="lbl">Разница</span><span class="val num ${st.net < 0 ? 'out' : 'in'}">${money(st.net, true)}</span></div>
    </div>
    <div class="flow ${base > 0 ? '' : 'emptybar'}" role="img" aria-label="${esc(cap)}">${bar}</div>
    <p class="flowcap">${esc(cap)}</p>
    ${segs.length || legendExtra.length ? `<ul class="legend">${segs.map(s => `<li><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.name)}</span>${overCats.has(s.id) ? '<span class="badge over">выше лимита</span>' : ''}<span class="num">${money(s.amt)}</span><span class="pc num">${Math.round(s.amt / pctBase * 100)}%</span></li>`).join('')}${legendExtra.map(s => `<li><span class="sw" style="background:${s.color}"></span><span class="nm">${s.name}</span><span class="num">${money(s.amt)}</span><span class="pc num">${Math.round(s.amt / pctBase * 100)}%</span></li>`).join('')}</ul>` : ''}
    ${usesDebt ? `<p class="hint">Расходы включают покупки кредиткой и проценты по долгам. Погашение основного долга и взносы в цели расходами не считаются, они показаны отдельными сегментами.</p>` : ''}
    ${!lims.length && st.spend > 0 ? `<p class="hint">Можно задать лимиты на месяц: <button class="chip" data-act="tab" data-v="settings">Настройки → Категории</button></p>` : ''}
  </section>`;
  html += limitsHtml(lims);
  html += debtsGoalsOverviewHtml();
  html += plansTimelineHtml();

  const tags = groupTags(list);
  if (tags.length) {
    const mx = tags[0].amt || 1;
    html += `<section><h2>Расходы по тегам</h2><ul class="bars">${tags.map(t => `<li><span>${esc(t.name)}</span><span class="track"><span class="fill" style="width:${Math.max(3, t.amt / mx * 100)}%;background:${t.color}"></span></span><span class="num">${money(t.amt)}</span></li>`).join('')}</ul>
      <p class="hint">Операция с несколькими тегами учитывается в каждом из них.</p></section>`;
  }
  const inc2 = groupCats(list, 'in');
  if (inc2.length) {
    const mx = inc2[0].amt || 1;
    html += `<section><h2>Доходы по категориям</h2><ul class="bars">${inc2.map(t => `<li><span>${esc(t.name)}</span><span class="track"><span class="fill" style="width:${Math.max(3, t.amt / mx * 100)}%;background:var(--income)"></span></span><span class="num">${money(t.amt)}</span></li>`).join('')}</ul></section>`;

}

/* — debts & goals tab — */
function debtCardHtml(d) {
  const st = debtStats(d), bal = st.balance, isCard = d.kind === 'card';
  const paidOff = bal <= 0.005;
  const ref = isCard ? (d.limit > 0 ? d.limit : Math.max(d.balance0, bal)) : Math.max(d.balance0, bal);
  const share = ref > 0 ? Math.max(0, Math.min(1, bal / ref)) : 0;
  const progLeft = isCard ? (d.limit > 0 ? `Использовано ${Math.round(share * 100)}% лимита` : '') : `Погашено ${Math.round((1 - share) * 100)}% от ${money(ref)}`;
  const progRight = isCard && d.limit > 0 ? `Доступно ${money(Math.max(0, d.limit - bal))} из ${money(d.limit)}` : '';
  const over = isCard && d.limit > 0 && bal > d.limit;
  const rows = [];
  if (st.principal) rows.push(['Погашено основного долга', money(st.principal)]);
  rows.push(['Проценты выплачено', money(st.interest)]);
  if (isCard && st.charges) rows.push(['Покупки по карте', money(st.charges)]);
  if (d.rate >= 0 && d.rate !== undefined && d.rate !== null) rows.push(['Ставка', `${String(d.rate).replace('.', ',')}% годовых`]);
  if (d.monthly > 0) rows.push([isCard ? 'Платёж в месяц' : 'Ежемесячный платёж', `${money(d.monthly)}${d.payDay ? `, ${d.payDay}-го числа` : ''}`]);
  if (st.last) rows.push(['Последний платёж', shortDate(st.last)]);
  let fc = '', fcWarn = false;
  if (!paidOff && d.monthly > 0) {
    const am = amortize(bal, d.rate || 0, d.monthly);
    if (am.ok) fc = `Если платить ${money(d.monthly)} в месяц${isCard ? ' и не тратить с карты' : ''}: закрытие через ${fmtMonths(am.months)} (${monthYear(am.months)}), проценты впереди примерно ${money(Math.round(am.interest))}.`;
    else if (am.reason === 'low') { fc = `Платёж ${money(d.monthly)} не покрывает проценты (около ${money(Math.round(am.monthlyInterest))} в месяц): долг не уменьшается.`; fcWarn = true; }
    else if (am.reason === 'long') fc = 'При таком платеже долг закроется больше чем через 100 лет.';
  } else if (!paidOff) fc = 'Укажите ставку и ежемесячный платёж в карточке долга — приложение покажет срок закрытия и будущие проценты.';
  let extra = '';
  if (!paidOff && d.monthly > 0) {
    const ex = parseNum(ui.extra[d.id]) || 0, base = amortize(bal, d.rate || 0, d.monthly);
    let res = '';
    if (ex > 0) {
      const alt = amortize(bal, d.rate || 0, d.monthly + ex);
      if (alt.ok && base.ok) res = `Платёж ${money(d.monthly + ex)}: закроете на ${fmtMonths(base.months - alt.months)} раньше и сэкономите примерно ${money(Math.round(base.interest - alt.interest))} на процентах.`;
      else if (alt.ok) res = `С такой доплатой долг начнёт уменьшаться: закрытие через ${fmtMonths(alt.months)}, проценты примерно ${money(Math.round(alt.interest))}.`;
      else res = 'Даже с такой доплатой платёж не покрывает проценты.';
    }
    extra = `<div class="extra"><label for="ex-${d.id}">А если доплачивать сверх платежа:</label><input id="ex-${d.id}" data-change="extra" data-id="${d.id}" inputmode="decimal" placeholder="0" value="${ex > 0 ? esc(fmtIn(ex)) : ''}" aria-label="Доплата в месяц"><span class="muted">в месяц</span>${res ? `<div class="res">${esc(res)}</div>` : ''}</div>`;
  }
  return `<div class="dcard">
    <div class="dhead"><div class="dname"><span class="dot" style="background:${col(d.color)}"></span><span class="t">${esc(d.name)}</span><span class="badge">${DEBT_KINDS[d.kind] || 'Долг'}</span>${paidOff ? '<span class="badge in">погашен</span>' : ''}${over ? '<span class="badge over">выше лимита карты</span>' : ''}</div>
      <div class="dbal"><b class="num">${money(bal)}</b><small>${isCard ? 'долг по карте' : 'остаток долга'}</small></div></div>
    <div class="track" role="img" aria-label="${esc(progLeft)}"><span class="fill" style="width:${Math.max(paidOff ? 0 : 2, share * 100)}%;background:${over ? 'var(--expense)' : col(d.color)}"></span></div>
    <div class="dprog"><span>${esc(progLeft)}</span><span>${esc(progRight)}</span></div>
    <dl class="dgrid">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd class="num">${esc(v)}</dd></div>`).join('')}</dl>
    ${fc ? `<p class="dfc ${fcWarn ? 'warn' : ''}">${esc(fc)}</p>` : ''}
    ${extra}
    <div class="dactions"><button class="btn sm" data-act="payDebt" data-id="${d.id}">Внести платёж</button><button class="btn sm ghost" data-act="editDebt" data-id="${d.id}">Изменить</button><button class="btn sm ghost" data-act="reconcile" data-id="${d.id}">Сверить остаток</button>${(d.adj || []).length ? `<button class="btn sm ghost" data-act="undoAdj" data-id="${d.id}">Отменить сверку</button>` : ''}</div>
  </div>`;
}
function goalCardHtml(g) {
  const saved = goalSaved(g), left = Math.max(0, round2(g.target - saved)), share = Math.max(0, Math.min(1, saved / g.target));
  const rows = [['Накоплено', money(saved)], ['Цель', money(g.target)]];
  let fc = '';
  if (left <= 0) fc = 'Цель достигнута.';
  else {
    if (g.deadline) {
      const days = daysBetween(today(), g.deadline);
      if (days > 0) { const mo = Math.max(1, Math.ceil(days / 30.4)); rows.push(['Срок', shortDate(g.deadline)]); fc = `Чтобы успеть к ${shortDate(g.deadline)}, нужно откладывать примерно ${money(Math.ceil(left / mo))} в месяц (${mo} ${plural(mo, ['месяц', 'месяца', 'месяцев'])}).`; }
      else { rows.push(['Срок', shortDate(g.deadline)]); fc = 'Срок уже прошёл. Можно перенести его в карточке цели.'; }
    }
    const since = new Date(); since.setMonth(since.getMonth() - 3);
    const recent = sum(allTx().filter(t => t.kind === 'goal' && t.goal === g.id && t.date >= `${since.getFullYear()}-${pad(since.getMonth() + 1)}-${pad(since.getDate())}`), t => t.amount);
    if (recent > 0) { const pace = recent / 3, mo = Math.ceil(left / pace); fc += `${fc ? ' ' : ''}При темпе последних трёх месяцев (около ${money(Math.round(pace))} в месяц) цель будет достигнута через ${fmtMonths(mo)} (${monthYear(mo)}).`; }
    else if (!fc) fc = 'Внесите первый взнос — приложение оценит, когда цель будет достигнута.';
  }
  return `<div class="dcard">
    <div class="dhead"><div class="dname"><span class="dot" style="background:var(--goal)"></span><span class="t">${esc(g.name)}</span>${g.done ? '<span class="badge in">достигнута</span>' : ''}</div>
      <div class="dbal"><b class="num">${money(left)}</b><small>осталось накопить</small></div></div>
    <div class="track" role="img" aria-label="${Math.round(share * 100)}% цели"><span class="fill" style="width:${Math.max(saved > 0 ? 2 : 0, share * 100)}%;background:var(--goal)"></span></div>
    <div class="dprog"><span>Накоплено ${Math.round(share * 100)}%</span><span>${money(saved)} из ${money(g.target)}</span></div>
    <dl class="dgrid">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd class="num">${esc(v)}</dd></div>`).join('')}</dl>
    ${fc ? `<p class="dfc">${esc(fc)}</p>` : ''}
    <div class="dactions"><button class="btn sm" data-act="goalDeposit" data-id="${g.id}">Отложить в цель</button><button class="btn sm ghost" data-act="editGoal" data-id="${g.id}">Изменить</button></div>
  </div>`;
}
function viewDebts(root) {
  const open = debts.filter(d => !d.closed), closed = debts.filter(d => d.closed);
  const total = round2(open.reduce((a, d) => a + Math.max(0, debtBalance(d)), 0));
  const monthly = sum(open.filter(d => debtBalance(d) > 0.005), d => d.monthly || 0);
  const allInterest = sum(debts, d => debtStats(d).interest);
  const rated = open.filter(d => d.rate > 0 && debtBalance(d) > 0.005).sort((a, b) => b.rate - a.rate);
  let html = `<section><div class="sechead"><h2>Долги</h2><button class="btn sm ghost" data-act="addDebt">＋ Долг</button></div>`;
  if (!debts.length) html += `<div class="empty"><p>Добавьте ипотеку, кредиты и кредитные карты. Для каждого укажите остаток долга из приложения банка, а дальше вносите платежи: приложение отдельно учтёт проценты, покажет остаток и срок закрытия. Кредитной картой можно оплачивать траты, они попадут в категории, а долг по карте вырастет.</p><button class="btn" data-act="addDebt">Добавить долг</button></div>`;
  else {
    html += `<div class="dtotal"><div><small>Долгов всего</small><b class="num out">${money(total)}</b></div><div><small>Платежей в месяц</small><b class="num">${money(monthly)}</b></div><div><small>Процентов выплачено</small><b class="num">${money(allInterest)}</b></div></div>`;
    if (rated.length > 1) html += `<p class="hint" style="margin:-6px 0 14px">Если появятся лишние деньги, по методу «лавины» выгоднее направить их в долг с самой высокой ставкой: «${esc(rated[0].name)}» (${String(rated[0].rate).replace('.', ',')}%).</p>`;
    html += open.map(debtCardHtml).join('');
    if (closed.length) html += `<details class="fold"><summary>Закрытые (${closed.length})</summary>${closed.map(debtCardHtml).join('')}</details>`;
  }
  html += `</section><section><div class="sechead"><h2>Цели</h2><button class="btn sm ghost" data-act="addGoal">＋ Цель</button></div>`;
  if (!goals.length) html += `<div class="empty"><p>Добавьте цель с нужной суммой, например накопить на крупную покупку. Приложение покажет, сколько ещё осталось накопить, и сколько откладывать в месяц, чтобы успеть к сроку.</p><button class="btn" data-act="addGoal">Добавить цель</button></div>`;
  else html += goals.map(goalCardHtml).join('');
  root.innerHTML = html + '</section>';
}

    <div class="btnrow"><button class="btn sm" data-act="exportJson">Сохранить копию (JSON)</button><button class="btn ghost sm" data-act="importPick">Восстановить из файла</button><button class="btn ghost sm" data-act="exportCsv">Операции (CSV)</button></div>

    <details class="help"><summary>Как поставить на телефон</summary>
      ${isStandalone() ? '<p>Приложение уже установлено на этом устройстве.</p>' : `<ol><li><b>Android, Chrome:</b> меню ⋮, затем «Установить приложение» или «Добавить на главный экран».</li><li><b>iPhone, Safari:</b> кнопка «Поделиться», затем «На экран Домой».</li></ol><p>Это работает, когда приложение открыто по ссылке (https), а не из файла. После установки оно открывается во весь экран и работает без интернета.</p>`}

}

/* ───────── modal infra ───────── */
function openSheet() {

}
function closeModal() {

  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
}
function formErr(msg, id) { const e = $('#ferr'); if (e) e.textContent = msg; const el = id && $('#' + id); if (el) el.focus(); return false; }

function catSelect(kind, value, isNew) {
  const opts = meta.cats.filter(c => c.kind === kind).map(c => `<option value="${c.id}" ${c.id === value && !isNew ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  return `<select id="f-cat" data-change="dcat"><option value="" ${!value && !isNew ? 'selected' : ''}>Без категории</option>${opts}<option value="__new__" ${isNew ? 'selected' : ''}>＋ Новая категория…</option></select>` +
    (isNew ? `<input id="f-newcat" class="mt" placeholder="Название новой категории" maxlength="40" value="${esc(draft.newCatName || '')}">` : '');
}
function tagBlock() {
  const chips = meta.tags.map(t => `<button type="button" class="chip ${draft.tags.includes(t.id) ? 'on' : ''}" style="--c:${col(t.color)}" data-act="toggleTag" data-id="${t.id}" aria-pressed="${draft.tags.includes(t.id)}">${esc(t.name)}</button>`).join('');
  return `<div class="field"><span>Теги</span><div class="chips" id="tagchips">${chips}</div>
    <div class="addtag"><input id="f-newtag" placeholder="Свой тег, например «Срочно»" maxlength="30" aria-label="Новый тег"><button type="button" class="btn ghost sm" data-act="addTagDraft">Добавить</button></div></div>`;
}
function kindSeg(list) {
  const all = { out: ['Расход', 'k-out'], in: ['Доход', 'k-in'], pay: ['Долг', 'k-pay'], goal: ['Цель', 'k-goal'] };
  return `<div class="seg2 kind" role="group" aria-label="Тип записи" style="margin-bottom:16px">${list.map(k => `<button type="button" class="${all[k][1]}" data-act="setKind" data-v="${k}" aria-pressed="${draft.kind === k}">${all[k][0]}</button>`).join('')}</div>`;
}
const FIELDS = { 'f-amount': 'amount', 'f-date': 'date', 'f-title': 'title', 'f-note': 'note', 'f-store': 'store', 'f-int': 'interest', 'f-after': 'after', 'f-debt': 'debt', 'f-goal': 'goal', 'f-src': 'src', 'f-actual': 'actual',
  'd-name': 'name', 'd-kind': 'dkind', 'd-bal0': 'bal0', 'd-start': 'start', 'd-rate': 'rate', 'd-monthly': 'monthly', 'd-payday': 'payday', 'd-limit': 'limit', 'gx-name': 'gname', 'gx-target': 'target', 'gx-saved0': 'saved0', 'gx-deadline': 'deadline' };
function syncDraft() {
  if (!draft) return;
  for (const [id, key] of Object.entries(FIELDS)) { const el = $('#' + id); if (el) draft[key] = el.value; }
  const cl = $('#d-closed'); if (cl) draft.closed = cl.checked;
  const nc = $('#f-newcat'); if (nc) draft.newCatName = nc.value;
}

/* подсказка про лимит категории и про лимит карты (мягкая, ничего не блокирует) */
function refreshLimitHint() {
  const el = $('#limhint'); if (!el || !draft || draft.type !== 'tx') return;
  if (draft.kind !== 'out') { el.innerHTML = ''; return; }
  const amt = parseNum($('#f-amount')?.value ?? draft.amount), add = amt > 0 ? amt : 0;
  const dv = $('#f-date')?.value || draft.date, key = isDate(dv) ? mkey(dv) : ui.month;
  const list = (months[key] || []).filter(t => t.id !== draft.id), others = list.filter(t => t.kind === 'out');
  const c = draft.catNew ? null : catById(draft.cat), lines = [];
  const line = (label, spent, limit) => {
    if (!add) return lines.push(`<span class="info">${esc(label)}: потрачено ${money(spent)} из ${money(limit)}</span>`);
    const after = round2(spent + add);
    if (after > limit) lines.push(`<span class="over">${esc(label)}: с этой записью превышение на ${money(after - limit)} (лимит ${money(limit)})</span>`);
    else lines.push(`<span class="${after >= limit * LIMIT_WARN ? 'warn' : 'info'}">${esc(label)}: после записи останется ${money(limit - after)} из ${money(limit)}</span>`);
  };
  if (c && c.limit > 0) line(`Лимит «${c.name}»`, sum(others.filter(t => t.cat === c.id), t => t.amount), c.limit);
  if (meta.totalLimit > 0) line('Общий лимит месяца', monthStats(list).spend, meta.totalLimit);
  const card = draft.src ? debtById(draft.src) : null;
  if (card) {
    const bal = debtBalance(card, draft.id), after = round2(bal + add);
    if (card.limit > 0 && after > card.limit) lines.push(`<span class="over">Кредитка «${esc(card.name)}»: долг станет ${money(after)}, это выше лимита карты ${money(card.limit)}</span>`);
    else lines.push(`<span class="info">Кредитка «${esc(card.name)}»: долг ${money(bal)}${add ? ` станет ${money(after)}` : ''}${card.limit > 0 ? `, доступно ${money(Math.max(0, card.limit - after))}` : ''}. Свободные деньги не уменьшатся.</span>`);
  }
  el.innerHTML = lines.join('');
}

/* — расчёт платежа по долгу: платёж, проценты и остаток связаны между собой — */
function payBalance() { const d = debtById(draft.debt); return d ? debtBalance(d, draft.id) : 0; }
function recomputeAfter() {
  const amt = parseNum(draft.amount) || 0, int = parseNum(draft.interest) || 0;
  draft.after = amt > 0 ? fmtIn(payBalance() - (amt - int)) : '';
}
function initPay() {
  const d = debtById(draft.debt) || debts.find(x => !x.closed) || debts[0];
  if (!d) return;
  draft.debt = d.id;
  if (!draft.id && (draft.amount === '' || draft.amount == null) && d.monthly > 0) draft.amount = fmtIn(d.monthly);
  const amt = parseNum(draft.amount) || 0;
  if (draft.interest === '' || draft.interest == null) {
    const est = estimateInterest(d, draft.date, draft.id);
    draft.estimated = Number.isFinite(est) && amt > 0;
    draft.interest = draft.estimated ? fmtIn(Math.min(est, amt)) : '';
  }
  draft.last = 'int';
  recomputeAfter();
}
function refreshPayCalc(source) {
  if (!draft || draft.kind !== 'pay') return;
  const d = debtById(draft.debt), box = $('#paycalc'); if (!d || !box) return;
  const bal = payBalance(), amt = parseNum($('#f-amount')?.value) || 0;
  const iEl = $('#f-int'), aEl = $('#f-after');
  const lines = [];
  if (source === 'after') {
    const aft = parseNum(aEl.value);
    if (Number.isFinite(aft)) { const int = round2(amt - (bal - aft)); draft.interest = int >= 0 ? fmtIn(Math.min(int, amt)) : ''; iEl.value = draft.interest; if (int < 0) lines.push(`<span class="over">Остаток после платежа не может быть больше, чем ${money(bal)} минус основная часть платежа. Проверьте цифры.</span>`); if (int > amt) lines.push(`<span class="over">Так получается, что проценты больше самого платежа: проверьте остаток.</span>`); }
  } else {
    const int = parseNum(iEl.value) || 0;
    draft.after = amt > 0 ? fmtIn(bal - (amt - int)) : ''; aEl.value = draft.after;
  }
  const int = parseNum(iEl.value) || 0;
  if (amt > 0) {
    if (int > amt) lines.push(`<span class="over">Проценты не могут быть больше суммы платежа.</span>`);
    else {
      const principal = round2(amt - int), after = round2(bal - principal);
      lines.push(`<span class="info">Основной долг уменьшится на ${money(principal)}${int > 0 ? `, ещё ${money(int)} уйдёт на проценты (это ваш расход)` : ''}. Остаток долга: ${money(bal)} → ${money(after)}.</span>`);
      if (after < -0.005) lines.push(`<span class="warn">Платёж больше остатка долга.</span>`);
    }
    if (draft.estimated) lines.push(`<span class="warn">Проценты оценены по ставке за прошедшие дни. Сверьте с графиком банка и при необходимости поправьте.</span>`);
  }
  box.innerHTML = lines.join('');
}
function refreshGoalCalc() {
  const box = $('#goalcalc'); if (!box || !draft || draft.kind !== 'goal') return;
  const g = goalById($('#f-goal')?.value || draft.goal); if (!g) { box.innerHTML = ''; return; }
  const saved = goalSaved(g, draft.id), amt = parseNum($('#f-amount')?.value) || 0;
  const after = round2(saved + (draft.gdir === 'out' ? -amt : amt));
  box.innerHTML = amt > 0 ? (after < 0 ? `<span class="over">Нельзя снять больше накопленного (${money(saved)}).</span>` : `<span class="info">Накоплено: ${money(saved)} → ${money(after)} из ${money(g.target)}. Останется накопить ${money(Math.max(0, g.target - after))}.</span>`) : `<span class="info">Накоплено ${money(saved)} из ${money(g.target)}.</span>`;
}

/* — transaction modal (расход, доход, платёж по долгу, взнос в цель) — */
function openTx(opts = {}) {
  lastFocus = document.activeElement;
  let base = { type: 'tx', id: null, kind: opts.kind || 'out', date: today(), amount: '', cat: '', title: '', store: '', tags: [], note: '', items: [], planId: null, ts: null, src: '', debt: opts.debt || '', interest: '', goal: opts.goal || '', gdir: 'in' };
  const ex = opts.id ? findTx(opts.id) : null;
  if (ex) base = Object.assign(base, clone(ex.tx), { oldKey: ex.key });
  else if (opts.prefill) base = Object.assign(base, clone(opts.prefill));
  base.type = 'tx'; base.catNew = false; base.newCatName = '';
  if (base.kind === 'goal' && base.amount < 0 && ex) { base.gdir = 'out'; base.amount = Math.abs(base.amount); }
  base.amount = base.amount === '' || base.amount == null ? '' : fmtIn(base.amount);
  base.interest = base.interest === '' || base.interest == null ? '' : fmtIn(base.interest);
  base.items = Array.isArray(base.items) ? base.items : [];   // позиции чеков из старых версий сохраняем как есть
  base.tags = (base.tags || []).filter(id => tagById(id));
  base.src = base.src || '';
  draft = base;
  if (draft.kind === 'pay') initPay();
  if (draft.kind === 'goal' && !draft.goal) draft.goal = (goals.find(g => !g.done) || goals[0] || {}).id || '';
  openSheet(); renderModal();
  if (!ex && !IS_MOBILE) $('#f-amount')?.focus(); else $('.sheet').focus();
}
function renderModal() {
  const box = $('#mcontent'); if (!box || !draft) return;
  box.innerHTML = ({ tx: txHtml, plan: planHtml, debt: debtHtml, goalx: goalxHtml, recon: reconHtml })[draft.type]();
  if (draft.type === 'tx') { refreshLimitHint(); if (draft.kind === 'pay') refreshPayCalc(); if (draft.kind === 'goal') refreshGoalCalc(); }
}
const TX_TITLES = { out: 'Расход', in: 'Доход', pay: 'Платёж по долгу', goal: 'Взнос в цель' };
function txHead() {

}
function txFoot() {

}
const amountField = (label, aria) => `<div class="field"><span>${label}</span><div class="amountwrap"><input id="f-amount" class="entersave" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(draft.amount)}" aria-label="${aria || label}"><span class="curs">${esc(meta.currency || '')}</span></div></div>`;
function txHtml() {

    ${dd && dd.rate > 0 ? `<div class="btnrow" style="margin:-4px 0 14px"><button type="button" class="btn ghost sm" data-act="estInt">Оценить проценты по ставке</button></div>` : ''}
    <div class="field"><span>Заметка (необязательно)</span><textarea id="f-note" maxlength="500">${esc(d.note || '')}</textarea></div>
